schema_version: 1.0.0
agent: rp-card-studio

# 这是能力目录，不是所有项目的强制清单。主 Agent 根据项目需求、宿主版本和真实证据启用其中的能力。
capabilities:
  - id: agent.project_blueprint
    owner: rp-project-blueprint
    consumers: [rp-project-foundation, st-integration-qa]
    supports: [total_design, first_playable, growth_tracks, parking_lot, next_handoff]
    fallback: 使用直接阶段流程
  - id: engineering.component_registry
    owner: st-component-architecture
    consumers: [st-runtime-authoring, st-frontend-authoring, st-integration-qa]
    supports: [registry, recipe, dependency_graph, component_update, source_artifact_parity]
    fallback: 直接维护项目 src 并整卡构建
  - id: engineering.regex_trace
    owner: st-render-regex
    consumers: [st-worldbook-regex, st-integration-qa]
    supports: [validate, fixtures, stage_trace, prompt_display_channels]
    fallback: 现有 Forge 正则静态验证
  - id: host.api_reference
    owner: st-api-reference
    consumers: [st-host-capabilities, st-runtime-authoring, st-frontend-authoring]
    supports: [signature, event_payload, variable_scope, version_provider, fallback]
    fallback: 记录 API 未确认并返回技术交接
  - id: host.runtime_debug
    owner: st-runtime-debug
    consumers: [st-integration-qa]
    supports: [browser, console, dom, interaction, lifecycle, runtime_evidence]
    fallback: runtime not_run
  - id: host.message_history
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-frontend-authoring, st-integration-qa]
    supports: [getChatMessages, setChatMessages, createChatMessages, deleteChatMessages, rotateChatMessages]
    fallback: 手动复制文本、普通叙事回退或不启用按钮
  - id: host.message_lifecycle
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-frontend-authoring]
    supports: [edit, swipe, reload, chat_switch, current_message_id, displayed_message_refresh, mvu_initialized, mvu_updated, event_cleanup]
    fallback: 只读渲染并在生命周期不确定时清理实例
  - id: host.variable_scopes
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-frontend-authoring]
    supports: [global, character, chat, message, script, extension, mvu, message_latest, wait_global_initialized]
    fallback: 只读当前消息或不提供持久化按钮
  - id: host.worldbook_binding
    owner: st-host-capabilities
    consumers: [st-worldbook-regex, st-integration-qa]
    supports: [inspect, import, bind_character, bind_chat, bind_global, create_chat_worldbook, read_back_binding, current_worldbook_aliases]
    fallback: 标准 JSON 交付并明确记录需要用户执行导入/绑定
  - id: host.worldbook_runtime
    owner: st-host-capabilities
    consumers: [st-worldbook-regex, st-runtime-authoring]
    supports: [getwi, activewi, preprocess_activation, recursive_activation, conditional_entry]
    fallback: 普通关键词扫描或常驻条目
  - id: host.regex_control
    owner: st-host-capabilities
    consumers: [st-worldbook-regex, st-integration-qa]
    supports: [inspect_regex, replace_regex, scoped_enable, run_on_edit, prompt_display_channels, regex_replay, version_checked]
    fallback: 卡内静态正则或手动启用说明
  - id: host.script_lifecycle
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-frontend-authoring]
    supports: [event_on, event_once, event_emit, unload_cleanup, script_buttons, reload_iframe, mvu_events, native_event_source]
    fallback: 局部 DOM 监听与 pagehide 清理
  - id: host.prompt_generation
    owner: st-host-capabilities
    consumers: [rp-experience-authoring, st-runtime-authoring, st-frontend-authoring]
    supports: [generate, generate_raw, quiet_generation, stop_generation, prompt_injection]
    fallback: 使用酒馆原生输入框和普通生成流程
  - id: host.prompt_injection
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-integration-qa]
    supports: [inject_prompt, uninject_prompts, preset_prompt_order, trigger_slash]
    fallback: 只把要求写入模型可见世界书条目或普通提示词
  - id: host.streaming_surface
    owner: st-host-capabilities
    consumers: [st-frontend-authoring, st-integration-qa]
    supports: [streaming_message_mount, stream_delta, message_replacement]
    fallback: 等待文本完成后再渲染消息前端
  - id: host.parent_dom_bridge
    owner: st-host-capabilities
    consumers: [st-frontend-authoring, st-runtime-authoring]
    supports: [parent_dom, input_box, input_event_dispatch, slash_input, host_global, iframe_bridge, popup, mobile_detection, capability_detection]
    fallback: iframe 内独立 UI、复制文本或普通输入框回退
  - id: runtime.ejs_phases
    owner: st-runtime-authoring
    consumers: [st-runtime-authoring, st-worldbook-regex]
    supports: [preparation, generate, render, render_permanent, cache, no_cache, inject]
    fallback: 不使用 EJS 或改为静态世界书条目
  - id: frontend.compiled_application
    owner: st-frontend-authoring
    consumers: [st-integration-qa]
    supports: [multi_file_html, typescript, vue, pinia, zod, tailwind, vite, deterministic_build]
    fallback: 原生 HTML/CSS/JS 模块化工程
  - id: frontend.zero_layer
    owner: st-frontend-authoring
    consumers: [st-integration-qa]
    supports: [message_replacement, history_restore, fullscreen, persistence, chat_switch_restore]
    fallback: 普通消息内前端
  - id: frontend.asset_library
    owner: st-frontend-authoring
    consumers: [st-frontend-authoring, st-integration-qa]
    supports: [font_recommendation, icon_selection, inline_svg, local_font, remote_font, fallback, provenance]
    fallback: 系统字体回退与项目自制 SVG/CSS
  - id: runtime.external_dependency
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-frontend-authoring]
    supports: [remote_loader, version_pin, load_order, fallback, runtime_evidence]
    fallback: 内嵌源码或删除该外部依赖

  - id: runtime.mvu_lifecycle
    owner: st-runtime-authoring
    consumers: [st-runtime-authoring, st-frontend-authoring, st-integration-qa]
    supports: [initvar, schema_generation, placeholder_emission, snapshot_cleanup, replay_restore, unique_loader, config_override]
    fallback: 只使用已验证的当前楼层变量读取，并明确关闭快照/额外模型等能力
  - id: runtime.mvu_version_matrix
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-integration-qa]
    supports: [base_loader_minimum, tool_calling_minimum, custom_body_minimum, batch_request_minimum]
    fallback: 降级到普通同轮消息更新或关闭不兼容的额外模型路线
  - id: host.api_resolution
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-frontend-authoring, st-integration-qa]
    supports: [iframe_globals, tavern_helper, sillytavern_context, parent_dom_fallback]
    fallback: 只使用当前表面可确认的能力，并显示普通浏览器预览回退
  - id: host.runtime_version
    owner: st-host-capabilities
    consumers: [st-runtime-authoring, st-frontend-authoring, st-integration-qa]
    supports: [tavern_version, tavern_helper_version, evidence_snapshot]
    fallback: 标记版本未读取，不把未验证环境说成已通过
  - id: host.regex_replay
    owner: st-host-capabilities
    consumers: [st-worldbook-regex, st-integration-qa]
    supports: [format_as_tavern_regexed_string, display_prompt_replay, old_message_replay]
    fallback: 静态正则测试与手工 SillyTavern 验证
  - id: host.audio_surface
    owner: st-host-capabilities
    consumers: [st-frontend-authoring, st-integration-qa]
    supports: [bgm, ambient, play_pause, playlist]
    fallback: 不启用音频，保留纯视觉体验
