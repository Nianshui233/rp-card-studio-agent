schema_version: 1.2.0
agent: rp-card-studio
state_persistence: project_files_and_conversation
stage_loop: orchestrator/stage-loop.md
# next 字段是建议顺序，不是创作执行授权；QA/交付按 automatic-work.md 在当前范围自动收尾。
stage_authorization: orchestrator/stage-authorization.md
interview_playbook: orchestrator/interview-playbook.md
interview_routes: internal-skills/rp-interview-orchestration/references/interview-routes.json
interview_coverage: internal-skills/rp-interview-orchestration/references/stage-coverage.json

stages:
  preflight:
    primary_skill: null
    supporting_skills: [st-host-capabilities]
    required_files: [orchestrator/automatic-work.md, scripts/host/discover-sillytavern.mjs, scripts/host/local-environment.mjs]
    optional: false
    next: continuation
  continuation:
    primary_skill: rp-project-continuation
    supporting_skills: [st-host-capabilities]
    required_files: [orchestrator/automatic-work.md, scripts/host/discover-sillytavern.mjs, scripts/host/local-environment.mjs]
    optional: false
    next: materials
  materials:
    primary_skill: rp-materials-research
    supporting_skills: [rp-project-foundation, rp-interview-orchestration]
    optional: true
    enable_when: source_material_present_or_external_research_required
    next: brainstorm
  brainstorm:
    primary_skill: rp-concept-brainstorm
    references: [brainstorm]
    supporting_skills: [rp-interview-orchestration]
    optional: true
    enable_when: brainstorm_enabled
    next: positioning
  positioning:
    primary_skill: rp-project-foundation
    references: [positioning]
    supporting_skills: [rp-interview-orchestration]
    optional: false
    next: worldbuilding
  worldbuilding:
    primary_skill: rp-project-foundation
    required_files: [internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    references: [worldbuilding]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: false
    next: character
  character:
    primary_skill: rp-cast-authoring
    required_files: [internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: false
    next: systems
  systems:
    primary_skill: rp-experience-authoring
    required_files: [internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    references: [systems]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: true
    next: scenes
  scenes:
    primary_skill: rp-experience-authoring
    required_files: [internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    references: [scenes]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: true
    next: mvu
  mvu:
    primary_skill: st-mvu-authoring
    required_files: [internal-skills/st-mvu-authoring/references/mvu-zod.md, internal-skills/st-mvu-authoring/references/mvu-source-build.md, scripts/mvu/mvu-zod-project.mjs, scripts/mvu/validate-mvu-zod-source-contract.mjs, scripts/mvu/mvu-source-tools.mjs, scripts/mvu/schema-offline-worker.mjs, scripts/mvu/validate-mvu-package.mjs, package.json, package-lock.json, assets/templates/mvu-zod-source-contract.json, internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    supporting_skills: [rp-interview-orchestration, st-host-capabilities, st-api-reference, st-worldbook-regex]
    optional: true
    enable_when: mvu_enabled
    next: ejs
  ejs:
    primary_skill: st-ejs-authoring
    required_files: [orchestrator/production-verification.md, scripts/production/check-plan.mjs, scripts/production/artifact-bindings.mjs, scripts/production/production-project.mjs, internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    supporting_skills: [rp-interview-orchestration, st-host-capabilities, st-api-reference, st-worldbook-regex]
    optional: true
    enable_when: ejs_enabled
    next: runtime_bridge
  runtime_bridge:
    primary_skill: st-mvu-ejs-bridge
    supporting_skills: [rp-interview-orchestration, st-mvu-authoring, st-ejs-authoring, st-host-capabilities, st-api-reference]
    optional: true
    enable_when: mvu_enabled_and_ejs_enabled_and_bridge_required
    next: narrative_opening
  narrative_opening:
    primary_skill: rp-experience-authoring
    required_files: [internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    references: [narrative-opening]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: true
    enable_when: new_narrative_rules_or_openings_requested
    next: opening_frontend
  opening_frontend:
    primary_skill: st-opening-frontend-authoring
    required_files: [internal-skills/st-opening-frontend-authoring/references/opening-design.md, internal-skills/st-opening-frontend-authoring/references/opening-design.json, internal-skills/st-opening-frontend-authoring/references/opening-review.md, shared/frontend/design-tools.md, scripts/frontend/design-guide.mjs, scripts/frontend/design-contract.mjs, scripts/frontend/preview-resources.mjs, scripts/production/decision-refs.mjs, shared/frontend/layout-preview.md, scripts/frontend/preview-layout.mjs, orchestrator/production-verification.md, scripts/production/check-plan.mjs, scripts/production/artifact-bindings.mjs, scripts/production/production-project.mjs, scripts/frontend/run-browser-fixtures.mjs, scripts/frontend/frontend-source-check.mjs, shared/frontend/boot-controller.mjs]
    supporting_skills: [rp-interview-orchestration, rp-materials-research, st-host-capabilities, st-api-reference, st-worldbook-regex, st-render-regex, st-tavern-helper-engineering]
    optional: true
    enable_when: opening_or_creation_frontend_requested
    next: message_frontend
  message_frontend:
    primary_skill: st-message-frontend-authoring
    required_files: [internal-skills/st-message-frontend-authoring/references/message-design.md, internal-skills/st-message-frontend-authoring/references/message-design.json, internal-skills/st-message-frontend-authoring/references/message-review.md, shared/frontend/design-tools.md, scripts/frontend/design-guide.mjs, scripts/frontend/design-contract.mjs, scripts/frontend/preview-resources.mjs, scripts/production/decision-refs.mjs, shared/frontend/layout-preview.md, scripts/frontend/preview-layout.mjs, orchestrator/production-verification.md, scripts/production/check-plan.mjs, scripts/production/artifact-bindings.mjs, scripts/production/production-project.mjs, scripts/frontend/run-browser-fixtures.mjs, scripts/frontend/frontend-source-check.mjs, shared/frontend/boot-controller.mjs]
    supporting_skills: [rp-interview-orchestration, rp-materials-research, st-host-capabilities, st-api-reference, st-worldbook-regex, st-render-regex, st-tavern-helper-engineering]
    optional: true
    enable_when: ongoing_message_ui_requested
    next: qa_delivery
  qa_delivery:
    primary_skill: st-integration-qa
    required_files: [scripts/frontend/design-contract.mjs, scripts/frontend/preview-resources.mjs, scripts/production/decision-refs.mjs, shared/frontend/layout-preview.md, scripts/frontend/preview-layout.mjs, orchestrator/automatic-work.md, scripts/production/automatic-qa.mjs, scripts/continuation/automatic-qa-policy.mjs, scripts/host/discover-sillytavern.mjs, scripts/host/local-environment.mjs, orchestrator/production-verification.md, scripts/production/check-plan.mjs, scripts/production/artifact-bindings.mjs, scripts/production/production-project.mjs, scripts/frontend/run-browser-fixtures.mjs, scripts/frontend/frontend-source-check.mjs, shared/frontend/boot-controller.mjs, internal-skills/st-worldbook-regex/references/worldbook-routing.md, scripts/worldbook/routing.mjs, scripts/worldbook/worldbook-project.mjs, scripts/worldbook/worldbook-check.mjs]
    supporting_skills: [st-runtime-debug, st-render-regex, st-host-capabilities, st-api-reference]
    execution: automatic_within_current_task
    optional: false
    next: null

skill_paths:
  rp-project-continuation: internal-skills/rp-project-continuation/SKILL.md
  rp-materials-research: internal-skills/rp-materials-research/SKILL.md
  rp-interview-orchestration: internal-skills/rp-interview-orchestration/SKILL.md
