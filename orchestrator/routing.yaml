schema_version: 1.1.0
agent: rp-card-studio
state_persistence: conversation_only
stage_loop: orchestrator/stage-loop.md
interview_playbook: orchestrator/interview-playbook.md

stages:
  preflight:
    primary_skill: null
    optional: false
    next: brainstorm
  brainstorm:
    primary_skill: rp-concept-brainstorm
    references: [brainstorm]
    supporting_skills: [rp-interview-orchestration]
    optional: true
    enable_when: brainstorm_enabled
    next: positioning
  positioning:
    primary_skill: rp-project-foundation
    references: [positioning]
    supporting_skills: [rp-interview-orchestration]
    optional: false
    next: materials
  materials:
    primary_skill: rp-project-foundation
    references: [materials]
    supporting_skills: [rp-interview-orchestration]
    optional: true
    enable_when: existing_materials_or_retrofit
    next: worldbuilding
  worldbuilding:
    primary_skill: rp-project-foundation
    references: [worldbuilding]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: false
    next: character
  character:
    primary_skill: rp-cast-authoring
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: false
    next: systems
  systems:
    primary_skill: rp-experience-authoring
    references: [systems]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: true
    next: scenes
  scenes:
    primary_skill: rp-experience-authoring
    references: [scenes]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: true
    next: mvu
  mvu:
    primary_skill: st-mvu-authoring
    supporting_skills: [rp-interview-orchestration, st-host-capabilities, st-api-reference, st-worldbook-regex]
    optional: true
    enable_when: mvu_enabled
    next: ejs
  ejs:
    primary_skill: st-ejs-authoring
    supporting_skills: [rp-interview-orchestration, st-host-capabilities, st-api-reference, st-worldbook-regex]
    optional: true
    enable_when: ejs_enabled
    next: runtime_bridge
  runtime_bridge:
    primary_skill: st-mvu-ejs-bridge
    supporting_skills: [rp-interview-orchestration, st-mvu-authoring, st-ejs-authoring, st-host-capabilities, st-api-reference]
    optional: true
    enable_when: mvu_enabled_and_ejs_enabled_and_bridge_required
    next: narrative_opening
  narrative_opening:
    primary_skill: rp-experience-authoring
    references: [narrative-opening]
    supporting_skills: [rp-interview-orchestration, st-worldbook-regex]
    optional: false
    next: opening_frontend
  opening_frontend:
    primary_skill: st-opening-frontend-authoring
    supporting_skills: [rp-interview-orchestration, st-host-capabilities, st-api-reference, st-worldbook-regex, st-render-regex]
    optional: true
    enable_when: opening_or_creation_frontend_requested
    next: message_frontend
  message_frontend:
    primary_skill: st-message-frontend-authoring
    supporting_skills: [rp-interview-orchestration, st-host-capabilities, st-api-reference, st-worldbook-regex, st-render-regex]
    optional: true
    enable_when: ongoing_message_ui_requested
    next: qa_delivery
  qa_delivery:
    primary_skill: st-integration-qa
    supporting_skills: [rp-interview-orchestration, st-runtime-debug, st-render-regex, st-host-capabilities, st-api-reference]
    optional: false
    next: null

skill_paths:
  rp-interview-orchestration: internal-skills/rp-interview-orchestration/SKILL.md
  rp-concept-brainstorm: internal-skills/rp-concept-brainstorm/SKILL.md
  rp-project-foundation: internal-skills/rp-project-foundation/SKILL.md
  rp-cast-authoring: internal-skills/rp-cast-authoring/SKILL.md
  rp-experience-authoring: internal-skills/rp-experience-authoring/SKILL.md
  st-mvu-authoring: internal-skills/st-mvu-authoring/SKILL.md
  st-ejs-authoring: internal-skills/st-ejs-authoring/SKILL.md
  st-mvu-ejs-bridge: internal-skills/st-mvu-ejs-bridge/SKILL.md
  st-opening-frontend-authoring: internal-skills/st-opening-frontend-authoring/SKILL.md
  st-message-frontend-authoring: internal-skills/st-message-frontend-authoring/SKILL.md
  st-worldbook-regex: internal-skills/st-worldbook-regex/SKILL.md
  st-host-capabilities: internal-skills/st-host-capabilities/SKILL.md
  st-api-reference: internal-skills/st-api-reference/SKILL.md
  st-runtime-debug: internal-skills/st-runtime-debug/SKILL.md
  st-render-regex: internal-skills/st-render-regex/SKILL.md
  st-integration-qa: internal-skills/st-integration-qa/SKILL.md
