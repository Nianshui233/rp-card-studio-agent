# EJS/ST-Prompt-Template 真实运行合同；shared_message_variables 是 MVU→EJS 只读桥。
ejs:
  enabled: true
  mode: worldbook_template
  execution_stage: preprocessing
  output_channel: prompt
  bridge_mode: shared_message_variables
  direction: mvu_to_ejs_readonly
  snapshot: current message variables for the active message/Swipe; never a latest write target
  failure: return an empty/static section and preserve the remaining prompt
  raw_message_evaluation_enabled: false
  sandbox: false
  autosave_enabled: false
  required_templates:
    - 动态内容总控
  acceptance:
    target_st_prompt_template: "1.17.9"
    runtime: not_run
