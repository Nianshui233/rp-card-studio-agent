<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雾港航站·面板</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#09131c;color:#eefaff;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}
.app{border:1px solid #315b72;border-radius:14px;padding:14px;background:linear-gradient(145deg,#112b3a,#0b1822)}
h1{margin:0 0 2px;color:#7de3ff;font-size:17px}
.sub{color:#9fc0d0;font-size:12px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cell{padding:10px;border:1px solid #315b72;border-radius:10px;background:#ffffff08;min-width:0}
.label{color:#9fc0d0;font-size:12px}
b{font-size:15px;word-break:break-all}
.bar{height:8px;border-radius:6px;background:#0a1b26;border:1px solid #315b72;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2fa7c9,#7de3ff)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid #4b7890;border-radius:8px;padding:3px 8px;font-size:12px;color:#cfe6f0}
.memo{margin-top:10px}
.memo input{width:100%;border:1px solid #4b7890;border-radius:8px;padding:8px 10px;background:#0e2230;color:#eefaff;font:inherit}
button{border:1px solid #4b7890;border-radius:8px;padding:8px 11px;background:#163448;color:#fff;cursor:pointer;margin-top:8px}
button:disabled{opacity:.5;cursor:wait}
.status{margin-top:8px;color:#aac5d3;font-size:12px}
.err{color:#ffb3a7}
@media(max-width:420px){body{padding:8px}.app{padding:10px}}
</style>
</head>
<body>
<main class="app">
  <h1>雾港航站·值班面板</h1>
  <p class="sub" id="floor">正在连接宿主……</p>
  <div class="grid">
    <div class="cell"><div class="label">区域</div><b id="area">—</b></div>
    <div class="cell"><div class="label">天气</div><b id="weather">—</b></div>
    <div class="cell"><div class="label">时段</div><b id="phase">—</b></div>
    <div class="cell"><div class="label">当前任务</div><b id="task">—</b></div>
    <div class="cell"><div class="label">体力</div><b id="staminaText">—</b><div class="bar"><i id="staminaBar" style="width:0%"></i></div></div>
  </div>
  <div class="cell" style="margin-top:8px"><div class="label">物资</div><div class="chips" id="supplies"></div></div>
  <div class="memo">
    <div class="label">玩家手记（只属于你，洛檀看不到，模型不会改写）</div>
    <input id="memoInput" maxlength="60" placeholder="例如：先去仓库领备用保险丝">
    <button id="saveMemo">记入本楼</button>
  </div>
  <div class="status" id="status"></div>
</main>
<script>
(() => {
  'use strict';
  var q = function (id) { return document.getElementById(id); };
  var stops = [];
  var messageId = null;

  function note(text, bad) {
    q('status').textContent = text;
    q('status').className = bad ? 'status err' : 'status';
  }

  function timeout(ms) {
    return new Promise(function (_, reject) {
      setTimeout(function () { reject(new Error('等待 MVU 超时（' + ms + 'ms）')); }, ms);
    });
  }

  function readState() {
    var data = Mvu.getMvuData({ type: 'message', message_id: messageId });
    var s = data && data.stat_data ? data.stat_data : null;
    if (!s) throw new Error('本楼没有 MVU 快照：请确认已启用「雾港航站·运行脚本」并新建聊天');
    return s;
  }

  function render(s) {
    q('area').textContent = s.世界 && s.世界.区域 != null ? String(s.世界.区域) : '未记录';
    q('weather').textContent = s.世界 && s.世界.天气 != null ? String(s.世界.天气) : '未记录';
    q('phase').textContent = s.世界 && s.世界.时段 != null ? String(s.世界.时段) : '未记录';
    q('task').textContent = s.角色 && s.角色.当前任务 != null ? String(s.角色.当前任务) : '未记录';
    var stamina = Number(s.角色 && s.角色.体力) || 0;
    stamina = Math.max(0, Math.min(100, stamina));
    q('staminaText').textContent = String(Math.round(stamina));
    q('staminaBar').style.width = stamina + '%';
    var box = q('supplies');
    box.textContent = '';
    var goods = s.物资 || {};
    var keys = Object.keys(goods);
    if (!keys.length) {
      var empty = document.createElement('span');
      empty.className = 'chip';
      empty.textContent = '（无记录）';
      box.appendChild(empty);
    } else {
      keys.forEach(function (k) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = k + '×' + String(goods[k]);
        box.appendChild(chip);
      });
    }
    q('memoInput').value = s.玩家备忘 && s.玩家备忘.最新 != null ? String(s.玩家备忘.最新) : '';
    q('floor').textContent = '第 ' + messageId + ' 楼快照 · 读取成功';
  }

  function refresh() {
    try {
      render(readState());
      note('');
    } catch (error) {
      note('读取失败：' + error.message, true);
    }
  }

  q('saveMemo').addEventListener('click', async function () {
    var btn = this;
    var text = q('memoInput').value.trim();
    if (!text) { note('先写点什么再记入。', true); return; }
    btn.disabled = true;
    try {
      var before = Mvu.getMvuData({ type: 'message', message_id: messageId });
      if (!before || !before.stat_data) throw new Error('本楼没有 MVU 快照，无法写入');
      var cmd = "_.set('玩家备忘.最新', " + JSON.stringify(text) + ");//玩家手记";
      var next = await Mvu.parseMessage(cmd, before);
      await Mvu.replaceMvuData(next, { type: 'message', message_id: messageId });
      var after = Mvu.getMvuData({ type: 'message', message_id: messageId });
      var ok = after && after.stat_data && after.stat_data.玩家备忘 && String(after.stat_data.玩家备忘.最新) === text;
      if (!ok) throw new Error('写回后读回校验未通过');
      render(after.stat_data);
      note('已记入第 ' + messageId + ' 楼。');
    } catch (error) {
      note('写入失败：' + error.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  function bindEvents() {
    if (typeof eventOn === 'function' && typeof tavern_events === 'object') {
      [tavern_events.MESSAGE_UPDATED, tavern_events.MESSAGE_SWIPED].forEach(function (name) {
        if (!name) return;
        var handle = stops.push(eventOn(name, function (id) {
          if (Number(id) === messageId) refresh();
        }));
        void handle;
      });
    }
    if (typeof Mvu !== 'undefined' && Mvu && Mvu.events) {
      stops.push(eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, function () { refresh(); }));
    }
    addEventListener('pagehide', function () {
      stops.forEach(function (item) { if (item && item.stop) item.stop(); });
    }, { once: true });
  }

  (async function boot() {
    try {
      if (typeof getCurrentMessageId !== 'function' || typeof getChatMessages !== 'function') {
        throw new Error('当前不是 Tavern Helper 消息 iframe');
      }
      messageId = getCurrentMessageId();
      if (typeof waitGlobalInitialized !== 'function') {
        throw new Error('宿主缺少 waitGlobalInitialized，请升级 Tavern Helper');
      }
      await Promise.race([waitGlobalInitialized('Mvu'), timeout(6000)]);
      bindEvents();
      refresh();
    } catch (error) {
      messageId = null;
      note('面板不可用：' + error.message, true);
    }
  })();
})();
</script>
</body>
</html>
