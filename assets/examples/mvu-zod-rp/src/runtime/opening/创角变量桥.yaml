schema_version: 1.0.0
display_name: 砂钟议事厅创角变量桥
runtime_kind: mvu_zod

input_fields:
  - id: name
    label: 名称
    type: text
    required: true
  - id: faction
    label: 所属议席
    type: text
    required: true
  - id: stance
    label: 当前立场
    type: text
    required: false

bindings:
  - input: name
    target: 角色.名称
    transform: text
  - input: faction
    target: 议案.当前议席
    transform: text
  - input: stance
    target: 舆论.当前立场
    transform: text

commit:
  route: update_message
  marker: "<议事厅创角设定/>"
  api_ref: 宿主预装 MVU 的真实更新管线（本夹具未实机运行）
  readback: 读回 Schema 状态，确认提交值已覆盖 prefault/default
  failure_fallback: 保留表单并生成可复制的更新消息，不显示成功
