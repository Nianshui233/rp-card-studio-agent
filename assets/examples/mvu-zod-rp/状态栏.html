<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:10px;background:#101715;color:#e8f0eb;font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif}.panel{border:1px solid #486257;border-radius:12px;padding:12px;background:#17221e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{background:#ffffff08;border-radius:8px;padding:7px}.k{color:#9bb7aa;font-size:11px}.v{font-weight:700;word-break:break-word}.status{margin-top:9px;color:#9bb7aa}.err{color:#ffad9e}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="panel"><div id="state" class="grid"><div class="item"><div class="k">状态</div><div class="v">读取中</div></div></div><div id="status" class="status" role="status" aria-live="polite">正在连接当前消息楼层……</div></div>
<script>
(async function(){
  'use strict';
  const box=document.getElementById('state');
  const status=document.getElementById('status');
  const stops=[];
  let timer=null;
  let messageId=null;
  const timeout=ms=>new Promise((_,reject)=>setTimeout(()=>reject(new Error('MVU 初始化超时')),ms));
  const item=(k,v)=>{const d=document.createElement('div');d.className='item';const a=document.createElement('div');a.className='k';a.textContent=k;const b=document.createElement('div');b.className='v';b.textContent=String(v==null?'未记录':v);d.append(a,b);return d};
  function read(){const data=Mvu.getMvuData({type:'message',message_id:messageId});if(!data||!data.stat_data||!data.schema)throw new Error('本楼没有完整 MVU_ZOD 快照');return data.stat_data}
  function render(s){box.textContent='';box.append(item('日期时间',(s.世界?.日期||'')+' '+(s.世界?.时间||'')),item('地点',s.世界?.地点),item('生命值',s.玩家?.生命值),item('体力',s.玩家?.体力),item('感染风险',s.玩家?.感染风险),item('主线',s.任务?.主线?.名称),item('阶段',s.任务?.主线?.阶段),item('可调查',(s.现场?.可调查目标||[]).join('、')||'暂无'));status.textContent='已读取第 '+messageId+' 楼当前快照';status.className='status'}
  async function refresh(){try{render(read())}catch(e){status.textContent='读取失败：'+(e.message||String(e));status.className='status err'}}
  function listen(name){if(typeof eventOn!=='function'||!name)return;const stop=eventOn(name,id=>{if(messageId===null||Number(id)===messageId)refresh()});if(stop&&typeof stop.stop==='function')stops.push(stop)}
  try{
    if(typeof getCurrentMessageId!=='function')throw new Error('当前不是 Tavern Helper 消息 iframe');
    if(typeof waitGlobalInitialized!=='function')throw new Error('缺少 waitGlobalInitialized');
    messageId=Number(getCurrentMessageId());
    if(!Number.isInteger(messageId)||messageId<0)throw new Error('无法取得数值消息楼层');
    await Promise.race([waitGlobalInitialized('Mvu'),timeout(8000)]);
    await refresh();
    if(typeof tavern_events==='object'){listen(tavern_events.MESSAGE_UPDATED);listen(tavern_events.MESSAGE_SWIPED)}
    timer=setInterval(refresh,2000);
  }catch(e){status.textContent='面板不可用：'+(e.message||String(e));status.className='status err'}
  addEventListener('pagehide',()=>{if(timer)clearInterval(timer);stops.forEach(stop=>stop.stop());},{once:true});
})();
</script>
</body>
</html>
