schema_version: 1.0.0
id: chaohen_worldbook
display_name: 潮痕档案馆世界书
status: locked

entries:
  - id: world_core
    display_name: 世界核心
    activation:
      mode: constant
      primary_keys: []
      secondary_keys: []
      selective: false
      logic: any
      case_sensitive: false
      match_whole_words: false
    insertion:
      position: before_char
      order: 100
      depth: null
      role: system
    probability: 100
    scan_depth: null
    recursion:
      prevent_incoming: false
      prevent_outgoing: false
      delay_until_recursion: false
    recipient: shared
    visibility: model
    enabled: true
    fallback: block
    content: |-
      世界名称: 潮痕档案馆
      类型: 海港城市群像 / 调查 / 日常危机
      核心基调: 潮湿、克制、有人情味的悬疑。
      自运转原则:
        - 城市中的机构、居民和事件即使没有镜头也会继续行动。
        - NPC 根据自己的目标、关系和资源推进，不等待某个角色发号施令。
        - 未确认的信息保留不确定性，不为了制造戏剧强行补齐真相。
      叙事原则:
        - 以可观察的行为、环境变化和对话呈现信息。
        - 不把状态栏、变量更新或 HTML 代码当作剧情正文。

  - id: archive_keyword
    display_name: 档案馆与潮痕
    activation:
      mode: keywords
      primary_keys: [档案馆, 潮痕, 旧码头]
      secondary_keys: []
      selective: false
      logic: any
      case_sensitive: false
      match_whole_words: false
    insertion:
      position: before_char
      order: 220
      depth: 4
      role: system
    probability: 100
    scan_depth: 4
    recursion:
      prevent_incoming: true
      prevent_outgoing: false
      delay_until_recursion: false
    recipient: shared
    visibility: model
    enabled: true
    fallback: block
    content: |-
      档案馆是旧码头旁的公共资料站，由夜班管理员轮流维护。
      潮痕是一种只在退潮后短暂出现的银灰色沉积物，来源尚未确认。
      相关线索可能引出居民委托、港务冲突或档案馆内部的隐瞒，但不预设唯一真相。

  - id: status_output_contract
    display_name: 状态栏输出契约
    activation:
      mode: constant
      primary_keys: []
      secondary_keys: []
      selective: false
      logic: any
      case_sensitive: false
      match_whole_words: false
    insertion:
      position: at_depth
      order: 900
      depth: 0
      role: system
    probability: 100
    scan_depth: null
    recursion:
      prevent_incoming: true
      prevent_outgoing: true
      delay_until_recursion: false
    recipient: shared
    visibility: model
    enabled: true
    fallback: block
    content: |-
      每次回复正文结束后，追加一次状态标记：<潮痕状态栏/>。
      只输出这个短标记，不要在标记位置写 HTML、CSS 或 JavaScript。
      如果本轮没有状态变化，也必须输出标记，让消息内界面保持可刷新。
      若需要记录变量变化，使用完整闭合的 <潮痕变量>...</潮痕变量>，并放在状态标记之前。

