schema_version: 1.0.0
display_name: 潮痕创角变量桥
runtime_kind: non_mvu

# 非 MVU 样本不伪造运行时 API；确认后生成一段可被正则/世界书消费的主控设定块。
input_fields:
  - id: name
    label: 姓名
    type: text
    required: true
  - id: entry_point
    label: 进入地点
    type: text
    required: true
  - id: occupation
    label: 当前营生
    type: text
    required: false

bindings:
  - input: name
    target: user_entry.profile.name
  - input: entry_point
    target: user_entry.profile.entry_point.location
  - input: occupation
    target: user_entry.profile.identity.public

commit:
  route: user_message
  marker: "<潮痕主控>"
  close_marker: "</潮痕主控>"
  output_example: |-
    <潮痕主控>
    name: 林砚
    entry_point: 旧码头档案馆
    occupation: 夜班抄录员
    </潮痕主控>
  readback: 后续回复和状态页能读到同一份主控设定；不把它冒充成 MVU stat_data
  failure_fallback: 保留表单并复制完整主控设定块，供手动发送
