<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨线状态台</title><style>body{margin:0;background:#0b1219;color:#e8f6ff;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:14px}.shell{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;border-bottom:1px solid #31546b;padding:12px 0}.tabs{display:flex;gap:8px;padding:12px 0}.tabs button,.act{padding:9px 13px;border:1px solid #31546b;border-radius:9px;background:#10212d;color:#e8f6ff;cursor:pointer}.tabs button.on{border-color:#79e2ff;background:#79e2ff22}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 4;border:1px solid #31546b;border-radius:14px;padding:14px;background:#10202bcc}.wide{grid-column:span 8}.full{grid-column:1/-1}.label{color:#79e2ff;font-size:11px;letter-spacing:.14em}.value{font-size:24px;font-weight:700}.view{display:none}.view.on{display:block}.list{padding:0;margin:0;list-style:none}.list li{padding:9px;border-left:3px solid #79e2ff;background:#ffffff08;margin-top:7px}.muted{color:#9bb1bf}@media(max-width:720px){.card,.wide{grid-column:1/-1}.top{display:block}}</style></head><body><main class="shell"><header class="top"><div><div class="label">RAINLINE RELAY</div><h1>雨线中继状态台</h1></div><div id="source" class="muted">等待状态</div></header><nav class="tabs"><button class="on" data-tab="overview">总览</button><button data-tab="task">任务</button><button data-tab="action">行动</button></nav><section class="view on" data-view="overview"><div class="grid"><article class="card"><div class="label">站点</div><div id="station" class="value">尚未建立</div></article><article class="card"><div class="label">天气</div><div id="weather" class="value">未知</div></article><article class="card"><div class="label">告警</div><div id="alert" class="value">无</div></article><article class="card wide"><div class="label">当前任务</div><ul class="list"><li id="taskText">暂无任务</li></ul></article></div></section><section class="view" data-view="task"><article class="card full"><div class="label">任务说明</div><p class="muted">任务状态来自当前楼层真实变量；EJS 动态上下文不会直接写入这里。</p><div id="taskDetail">等待读取。</div></article></section><section class="view" data-view="action"><article class="card full"><div class="label">宿主行动</div><button class="act" id="send">请求检查三号浮桥灯标</button><p id="feedback" class="muted">等待操作。</p></article></section></main><script>(()=>{const host=parent!==window?parent:window;const $=id=>document.getElementById(id);const state=window.__RAINLINE_STATE__||{};const station=state.站点||{};const task=state.当前任务||{};$('station').textContent=station.名称||'尚未建立';$('weather').textContent=state.天气||'未知';$('alert').textContent=state.告警||'无';$('taskText').textContent=(task.名称||'暂无任务')+' · '+(task.状态||'未知');$('taskDetail').textContent='状态读取：'+(state.__source||'真实 MVU 或宿主桥');$('source').textContent=state.__source||'等待宿主状态';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('[data-view]').forEach(v=>v.classList.toggle('on',v.dataset.view===b.dataset.tab))});$('send').onclick=()=>{const text='我请求检查三号浮桥灯标';try{const ta=host.document.querySelector('#send_textarea');if(!ta)throw Error('宿主输入框不可用');ta.value=text;ta.dispatchEvent(new Event('input',{bubbles:true}));$('feedback').textContent='已写入酒馆输入框：'+text}catch(e){navigator.clipboard?.writeText(text);$('feedback').textContent='宿主不可用，已准备复制：'+text}}})();</script></body></html>
