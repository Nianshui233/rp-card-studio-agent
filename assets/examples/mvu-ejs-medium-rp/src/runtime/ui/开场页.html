<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨线值班登记</title><style>body{margin:0;background:#101923;color:#eaf5ff;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:20px}.app{max-width:720px;margin:auto;border:1px solid #37617b;border-radius:18px;padding:24px;background:linear-gradient(145deg,#162b3a,#0b111a);box-shadow:0 20px 50px #0008}h1{margin:0 0 8px;color:#79e2ff}.muted{color:#9bb1bf}label{display:block;margin:14px 0 6px}input,select{width:100%;padding:11px;border:1px solid #37617b;border-radius:9px;background:#09121b;color:#fff}button{margin-top:18px;padding:11px 16px;border:1px solid #79e2ff;border-radius:9px;background:#79e2ff22;color:#fff;cursor:pointer}.out{margin-top:16px;padding:12px;border-radius:10px;background:#ffffff08;white-space:pre-wrap}</style></head><body><main class="app"><div class="muted">RAINLINE RELAY / NIGHT SHIFT</div><h1>雨线中继值班登记</h1><p class="muted">先登记值班身份与今晚最在意的方向，进入一座会自行运转的河湾中继站。</p><label>姓名<input id="name" placeholder="填写姓名"></label><label>值班方向<select id="duty"><option>核对灯标</option><option>追查货船</option><option>查看登记册</option></select></label><button id="submit">生成值班设定</button><div id="out" class="out">尚未提交。</div></main><script>(()=>{const $=id=>document.getElementById(id);$('submit').onclick=()=>{const text=`<雨线创角>\n值班员：${$('name').value||'未填写'}\n值班方向：${$('duty').value}\n</雨线创角>`;$('out').textContent=text;try{const p=parent!==window?parent:window;const ta=p.document.querySelector('#send_textarea');if(ta){ta.value=text;ta.dispatchEvent(new Event('input',{bubbles:true}));$('out').textContent+='\n已写入酒馆输入框。';}}catch(e){$('out').textContent+='\n宿主不可用，请复制上方文本。';}}})();</script></body></html>
