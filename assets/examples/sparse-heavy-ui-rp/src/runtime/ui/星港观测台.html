<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>星港观测台</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0f1d2f;--line:#29425f;--text:#e8f2ff;--muted:#8fa8c2;--signal:#ffb454;--cyan:#77d9e6}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#153a52 0,#07101d 45%,#04080e 100%);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:14px}.shell{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.brand{display:flex;gap:12px;align-items:center}.beacon{width:38px;height:38px;border:1px solid var(--cyan);border-radius:50%;box-shadow:0 0 24px #77d9e666;position:relative}.beacon:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 18px var(--signal)}h1{font-size:clamp(24px,5vw,42px);margin:0}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0}.tabs button,.action{border:1px solid var(--line);background:#0d1a2a;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}.tabs button.active,.action.primary{border-color:var(--signal);background:#ffb4541a}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 4;background:#0d1827cc;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 36px #0004}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.label{font-size:11px;letter-spacing:.12em;color:var(--cyan)}.metric{font-size:28px;font-weight:700;margin-top:3px}.bar{height:8px;background:#ffffff12;border-radius:10px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--signal));width:0}.list{display:grid;gap:8px;padding:0;margin:0;list-style:none}.list li{padding:9px;border-left:3px solid var(--signal);background:#ffffff08}.empty{color:var(--muted);font-style:italic}.search{width:100%;background:#07111e;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}@media(max-width:760px){.top{align-items:start;flex-direction:column}.card,.card.wide{grid-column:1/-1}}
  </style>
</head>
<body>
  <div class="shell" id="app">
    <header class="top"><div class="brand"><span class="beacon" aria-hidden="true"></span><div><div class="label">STARPORT OBSERVATORY</div><h1>星港观测台</h1></div></div><div id="stamp" class="muted">读取中…</div></header>
    <nav class="tabs" aria-label="功能页签"><button class="active" data-tab="overview">总览</button><button data-tab="records">观测记录</button><button data-tab="port">港口资料</button><button data-tab="actions">行动</button></nav>
    <section class="view active" data-view="overview"><div class="grid"><article class="card"><div class="label">当前位置</div><div id="location" class="metric">尚未建立</div><div class="muted">权威变量：航线.当前位置</div></article><article class="card"><div class="label">燃料</div><div id="fuel" class="metric">暂无记录</div><div class="bar"><i id="fuelBar"></i></div><div class="muted">只在真实数值存在时计算派生百分比</div></article><article class="card"><div class="label">风险摘要</div><div id="risk" class="metric">暂无记录</div><div class="muted">由真实航线与观测记录派生</div></article><article class="card wide"><div class="label">今日提示</div><ul id="brief" class="list"></ul></article><article class="card full"><div class="label">本页原则</div><p class="muted">重型来自导航、信息组织、交互和宿主联动；动态字段少不会把完整体验降级成几项静态数字。</p></article></div></section>
    <section class="view" data-view="records"><div class="card full"><div class="label">观测记录</div><input id="search" class="search" placeholder="搜索记录关键词"><ul id="records" class="list" style="margin-top:10px"></ul></div></section>
    <section class="view" data-view="port"><div class="grid"><article class="card wide"><div class="label">港口资料</div><ul id="portInfo" class="list"></ul></article><article class="card"><div class="label">值班规则</div><ul id="rules" class="list"></ul></article></div></section>
    <section class="view" data-view="actions"><div class="card full"><div class="label">行动入口</div><p class="muted">行动按钮只是便利联动，不替剧情系统伪造结果。</p><div class="actions"><button class="action primary" data-send="查看当前航线">查看当前航线</button><button class="action" data-send="申请一次港口观测">申请一次港口观测</button><button class="action" data-send="打开值班记录">打开值班记录</button></div><p id="feedback" class="muted">等待操作。</p></div></section>
  </div>
  <script>
    (()=>{
      const host=window.parent&&window.parent!==window?window.parent:null;const s=window.__STARPORT_STATE__||{};const $=id=>document.getElementById(id);const text=(v,e='暂无记录')=>v===undefined||v===null||v===''?e:String(v);const list=(id,items,empty='暂无记录')=>{$(id).innerHTML=Array.isArray(items)&&items.length?items.map(x=>`<li>${text(x)}</li>`).join(''):`<li class="empty">${empty}</li>`};
      $('stamp').textContent=text(s.time,'时间未知');$('location').textContent=text(s.route?.location,'尚未建立');$('fuel').textContent=s.route?.fuel===undefined?'暂无记录':`${s.route.fuel}%`;if(Number.isFinite(Number(s.route?.fuel)))$('fuelBar').style.width=Math.max(0,Math.min(100,Number(s.route.fuel)))+'%';$('risk').textContent=text(s.derived?.risk,'暂无记录');list('brief',s.static?.briefs,'暂无提示');list('records',s.observations,'暂无观测记录');list('portInfo',s.static?.port_info,'暂无港口资料');list('rules',s.static?.rules,'暂无值班规则');
      document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-view]').forEach(v=>v.classList.toggle('active',v.dataset.view===b.dataset.tab))}));
      const records=()=>Array.from(document.querySelectorAll('#records li'));$('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();records().forEach(li=>li.hidden=q&&!li.textContent.toLowerCase().includes(q))});
      const feedback=t=>{$('feedback').textContent=t};const send=t=>{if(typeof host?.do_sillytavern_input==='function'){host.do_sillytavern_input(t);feedback('已尝试写入酒馆输入框：'+t)}else{navigator.clipboard?.writeText(t);feedback('宿主不可用，已准备复制：'+t)}};document.querySelectorAll('[data-send]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.send)));
    })();
  </script>
</body>
</html>
