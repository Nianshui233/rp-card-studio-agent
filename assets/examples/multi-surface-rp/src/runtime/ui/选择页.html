<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>:root{--c:#80e7ff;--b:#0c1720;--p:#142936;--l:#315568;--t:#eefaff}*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;color:var(--t);font:14px/1.5 "Microsoft YaHei"}.surface{border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,var(--p),var(--b));box-shadow:0 12px 30px #0007;overflow:hidden}.head{display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--l);color:var(--c)}.body{padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile,.option{padding:10px;border:1px solid var(--l);border-radius:10px;background:#0d1c26;color:var(--t)}button{cursor:pointer}button:hover{border-color:var(--c)}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="surface"><header class="head"><b>可选行动</b><span>玻璃潮汐</span></header><section class="body"><div id="options" class="grid"></div><p id="feedback"></p></section></main><script>(()=>{const raw=`$1`;const values=raw.split(/\n+/).map(x=>x.replace(/^[-*\d.、\s]+/,'').trim()).filter(Boolean);options.innerHTML=values.map(x=>'<button class="option">'+x.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</button>').join('');options.onclick=e=>{if(!e.target.matches('button'))return;const h=window.parent;const t=h?.document?.querySelector('#send_textarea');if(t){t.value=e.target.textContent;t.dispatchEvent(new Event('input',{bubbles:true}));feedback.textContent='已选择，可继续编辑后发送'}}})()</script></body></html>
