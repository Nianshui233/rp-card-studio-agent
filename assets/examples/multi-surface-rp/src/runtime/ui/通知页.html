<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>:root{--c:#80e7ff;--b:#0c1720;--p:#142936;--l:#315568;--t:#eefaff}*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;color:var(--t);font:14px/1.5 "Microsoft YaHei"}.surface{border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,var(--p),var(--b));box-shadow:0 12px 30px #0007;overflow:hidden}.head{display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--l);color:var(--c)}.body{padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile,.option{padding:10px;border:1px solid var(--l);border-radius:10px;background:#0d1c26;color:var(--t)}button{cursor:pointer}button:hover{border-color:var(--c)}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="surface"><header class="head"><b>事件通知</b><span>玻璃潮汐</span></header><section class="body"><article class="tile"><b id="noticeTitle">$1</b><p id="noticeText">$2</p><button class="option" id="ack">写入“我已知晓”</button><span id="feedback"></span></article></section></main><script>ack.onclick=()=>{const h=window.parent;const t=h?.document?.querySelector('#send_textarea');if(t){t.value='我已知晓这项变化，并据此继续行动。';t.dispatchEvent(new Event('input',{bubbles:true}));feedback.textContent='已写入输入框'}}</script></body></html>
