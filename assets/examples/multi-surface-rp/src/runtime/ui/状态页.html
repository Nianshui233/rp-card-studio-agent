<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>:root{--c:#80e7ff;--b:#0c1720;--p:#142936;--l:#315568;--t:#eefaff}*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;color:var(--t);font:14px/1.5 "Microsoft YaHei"}.surface{border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,var(--p),var(--b));box-shadow:0 12px 30px #0007;overflow:hidden}.head{display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--l);color:var(--c)}.body{padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile,.option{padding:10px;border:1px solid var(--l);border-radius:10px;background:#0d1c26;color:var(--t)}button{cursor:pointer}button:hover{border-color:var(--c)}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="surface"><header class="head"><b>潮汐状态</b><span>玻璃潮汐</span></header><section class="body"><div class="grid"><div class="tile">区域<br><b id="area">未记录</b></div><div class="tile">潮位<br><b id="tide">--</b></div><div class="tile">体力<br><b id="energy">--</b></div></div><details style="margin-top:10px"><summary>当前人物与线索</summary><div id="detail">等待当前消息数据</div></details></section></main><script>(()=>{const h=window.parent&&window.parent!==window?window.parent:window;const get=window.getVariables||h.getVariables;Promise.resolve(get?.({type:'message',message_id:(window.getCurrentMessageId||h.getCurrentMessageId)?.()??'current'})).then(v=>{const s=v?.stat_data||{};area.textContent=s.世界?.区域??'未记录';tide.textContent=s.世界?.潮位??'--';energy.textContent=s.主控?.体力??'--';detail.textContent=[...(s.人物||[]),...(s.线索||[])].map(x=>x.姓名||x.标题||x).join(' · ')||'暂无'})})()</script></body></html>
