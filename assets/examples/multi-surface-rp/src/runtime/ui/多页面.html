<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>:root{--c:#80e7ff;--b:#0c1720;--p:#142936;--l:#315568;--t:#eefaff}*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;color:var(--t);font:14px/1.5 "Microsoft YaHei"}.surface{border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,var(--p),var(--b));box-shadow:0 12px 30px #0007;overflow:hidden}.head{display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--l);color:var(--c)}.body{padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile,.option{padding:10px;border:1px solid var(--l);border-radius:10px;background:#0d1c26;color:var(--t)}button{cursor:pointer}button:hover{border-color:var(--c)}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="surface"><header class="head"><b>多表面索引</b><span>玻璃潮汐</span></header><section class="body"><div class="grid"><div class="tile">状态页：读取当前楼层变量</div><div class="tile">通知页：展示事件并联动输入框</div><div class="tile">选择页：把模型选项转为按钮</div></div></section></main><script></script></body></html>
