<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玻璃潮汐</title><style>body{margin:0;padding:14px;background:#0b1220;color:#eaf2ff;font-family:"Microsoft YaHei",sans-serif}.app{max-width:760px;margin:auto}.card{border:1px solid #355c86;border-radius:12px;padding:16px;margin:10px 0;background:#111d30}.accent{color:#77d5ff}.choice{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 12px;border-radius:8px;border:1px solid #4a86b9;background:#132943;color:#eaf2ff;cursor:pointer}button:hover{background:#21466d}</style></head><body><main class="app"><div class="card"><h2 class="accent">玻璃潮汐</h2><p id="status">状态等待刷新</p></div><div class="card"><h3>操作</h3><div class="choice"><button data-choice="查看潮汐">查看潮汐</button><button data-choice="记录异常">记录异常</button></div><p id="feedback"></p></div></main><script>const s=window.__RP_STATE__||{};document.querySelector('#status').textContent=s.summary||'暂无状态摘要';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const t=`我选择了：${b.dataset.choice}`;document.querySelector('#feedback').textContent=t;if(window.parent?.sendTextareaMessage)window.parent.sendTextareaMessage(t);});</script></body></html>
