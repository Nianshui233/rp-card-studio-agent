schema_version: 1.0.0
status: locked
operation: edit
card_entry:
  mode: project_entry
  content: "回声车站是一份旧档案改造后的独立 RP 项目入口。"
  source_refs: [src/world/旧档案世界书.yaml]
original:
  input: src/original/original.json
  preserved: src/original/preserved.json
  decisions:
    - path: data.character_book.entries[0]
      decision: migrate
      reason: "世界核心仍有效，改为独立世界书条目"
    - path: data.extensions.unknown_runtime
      decision: preserve
      reason: "未知字段不丢失，暂不宣称运行"
    - path: data.character_book.entries[user]
      decision: replace
      reason: "清理旧主控档案并提供空白 <user> 模板"
    - path: data.extensions.regex_scripts
      decision: revise
      reason: "保留标记语义，重做显示与隐藏配对"
content_boundary:
  authoring_action: clean_and_omit
  source_fidelity: "只在 original.json / preserved.json 保留输入保真，不作为可导入组件"
  maintained_sources: "不写入涉及未成年人的成人性内容"
  runtime_gate: none
worldbook:
  file: src/world/旧档案世界书.yaml
  user_template: src/user-character.yaml
runtime:
  regex:
    - src/runtime/regex/状态栏.json
  html:
    - src/runtime/ui/改造状态页.html
  scripts:
    - src/runtime/scripts/变量桥.js
  marker_contract: src/runtime/opening/创角变量桥.yaml
delivery:
  mode: rp_project_package
  preserve_unknown_fields: true
  runtime: not_run
