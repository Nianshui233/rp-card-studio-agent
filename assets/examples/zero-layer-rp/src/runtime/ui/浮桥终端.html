<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浮桥终端</title><style>
:root{--bg:#080b12;--panel:#121927;--line:#314463;--text:#e9f0ff;--accent:#9bd2ff;--warn:#f2c879}*{box-sizing:border-box}body{margin:0;padding:12px;background:radial-gradient(circle at top,#18233a,#080b12 70%);color:var(--text);font-family:"Microsoft YaHei",sans-serif}.terminal{max-width:1080px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:560px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0d1422}.side{padding:16px;background:#0a101b;border-right:1px solid var(--line)}.side h1{font-size:1.05rem;color:var(--accent)}.nav{display:grid;gap:8px;margin-top:20px}.nav button,.action{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);text-align:left;cursor:pointer}.nav button.active,.nav button:hover,.action:hover{border-color:var(--accent);color:var(--accent)}.main{padding:18px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(18,25,39,.9)}.metric{font-size:2rem;color:var(--warn)}.feed{max-height:260px;overflow:auto}.feed p{padding:8px 0;margin:0;border-bottom:1px solid #273752}@media(max-width:720px){.terminal{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main class="terminal"><aside class="side"><h1>浮桥终端</h1><div class="nav"><button class="active" data-view="dashboard">指挥台</button><button data-view="records">记录库</button><button data-view="actions">行动</button></div></aside><section class="main"><div id="dashboard" class="view active"><div class="grid"><article class="panel"><div>当前潮压</div><div class="metric" id="pressure">--</div></article><article class="panel"><div>可用行动</div><div class="metric" id="action-count">--</div></article></div><article class="panel" style="margin-top:12px"><h2>事件流</h2><div class="feed" id="feed">等待消息状态……</div></article></div><div id="records" class="view"><article class="panel"><h2>记录库</h2><p>完整应用可以在此组织检索、筛选、详情与回溯，不要求把每个功能拆成互不相干的小正则。</p></article></div><div id="actions" class="view"><article class="panel"><h2>行动</h2><button class="action" data-action="向浮桥发送探照信号">向浮桥发送探照信号</button><p id="feedback"></p></article></div></section></main><script>
(()=>{const q=s=>document.querySelector(s);const state=window.__RP_STATE__||{};q('#pressure').textContent=state.pressure??'未记录';q('#action-count').textContent=state.actions??'未记录';q('#feed').innerHTML=(state.feed||['消息状态尚未载入']).map(x=>`<p>${String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</p>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view));});q('[data-action]')?.addEventListener('click',e=>{const t=`我执行了：${e.currentTarget.dataset.action}`;q('#feedback').textContent=t;if(window.parent?.sendTextareaMessage)window.parent.sendTextareaMessage(t);});})();
</script></body></html>
