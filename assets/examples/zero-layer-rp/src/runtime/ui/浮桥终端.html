<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浮桥终端</title><style>
:root{--bg:#071018;--panel:#102231;--panel2:#173346;--line:#2b5368;--text:#edf8ff;--muted:#9bb6c5;--cyan:#67e8f9;--amber:#f6c76e;--red:#ff7b86;--green:#79e2a6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#173d50 0,transparent 36%),linear-gradient(150deg,#071018,#0a1621 55%,#08111a);color:var(--text);font:14px/1.55 "Microsoft YaHei",sans-serif}.app{min-height:720px;display:grid;grid-template-columns:250px minmax(0,1fr);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 28px 80px #0009}.rail{padding:20px;background:#07131dcc;border-right:1px solid var(--line);backdrop-filter:blur(18px)}.brand small,.muted{color:var(--muted)}.brand h1{margin:.2rem 0;color:var(--cyan);letter-spacing:.12em}.nav{display:grid;gap:8px;margin:28px 0}.nav button,.button,.chip{border:1px solid var(--line);background:linear-gradient(180deg,#163044,#102331);color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer}.nav button{text-align:left}.nav button.active,.nav button:hover,.button:hover{border-color:var(--cyan);box-shadow:0 0 0 1px #67e8f933 inset}.rail-card{padding:13px;border:1px solid var(--line);border-radius:13px;background:#0d1d29}.workspace{padding:22px;min-width:0}.topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}.topbar input{width:min(360px,48vw);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#08131d;color:var(--text)}.view{display:none;animation:fade .18s ease}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.card{grid-column:span 4;padding:16px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(160deg,#122a3aee,#0c1a25ee)}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.metric{font-size:2rem;color:var(--amber);font-weight:700}.bar{height:8px;background:#07131d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #244254}.tag{padding:2px 8px;border-radius:999px;background:#22485d;color:#c9f7ff}.danger{color:var(--red)}.log{max-height:310px;overflow:auto}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.feedback{min-height:24px;color:var(--green)}dialog{border:1px solid var(--line);border-radius:16px;background:#0c1b26;color:var(--text);max-width:520px;width:calc(100% - 32px)}dialog::backdrop{background:#000b}.empty,.error,.loading{padding:18px;text-align:center;color:var(--muted)}@keyframes fade{from{opacity:.45;transform:translateY(4px)}}@media(max-width:850px){.app{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.card,.card.wide{grid-column:span 6}}@media(max-width:560px){.workspace{padding:13px}.card,.card.wide{grid-column:1/-1}.action-grid{grid-template-columns:1fr}.topbar{align-items:stretch;flex-direction:column}.topbar input{width:100%}}
</style></head><body><main class="app"><aside class="rail"><div class="brand"><small>ZERO-LAYER MESSAGE APP</small><h1>浮桥终端</h1><div id="clock" class="muted">等待状态同步</div></div><nav class="nav"><button class="active" data-view="overview">航行总览</button><button data-view="crew">人物与关系</button><button data-view="cargo">物资仓</button><button data-view="intel">线索档案</button><button data-view="actions">行动台</button><button data-view="history">历史回看</button></nav><section class="rail-card"><b>连接状态</b><div id="connection" class="feedback">初始化中</div><button class="button" data-action="refresh">重新读取当前楼层</button></section></aside><section class="workspace"><header class="topbar"><div><b id="location">未知区域</b><div class="muted" id="weather">环境尚未载入</div></div><input id="search" placeholder="搜索人物、物资、线索与历史"></header><section id="overview" class="view active"><div class="grid"><article class="card"><span>潮压</span><div class="metric" id="pressure">--</div><div class="bar"><i id="pressureBar"></i></div></article><article class="card"><span>船体完整</span><div class="metric" id="hull">--</div><div class="bar"><i id="hullBar"></i></div></article><article class="card"><span>可用行动</span><div class="metric" id="actionCount">--</div></article><article class="card wide"><h2>当前事件流</h2><div id="feed" class="list loading">正在读取当前消息状态……</div></article><article class="card"><h2>风险</h2><div id="risks" class="list empty">暂无数据</div></article></div></section><section id="crew" class="view"><article class="card full"><h2>人物与关系</h2><div id="crewList" class="list"></div></article></section><section id="cargo" class="view"><article class="card full"><h2>物资仓</h2><div id="cargoList" class="list"></div></article></section><section id="intel" class="view"><article class="card full"><h2>线索档案</h2><div id="intelList" class="list"></div></article></section><section id="actions" class="view"><article class="card full"><h2>行动台</h2><div id="actionList" class="action-grid"></div><p id="actionFeedback" class="feedback"></p></article></section><section id="history" class="view"><article class="card full"><h2>历史回看</h2><button class="button" data-action="load-history">读取最近消息</button><div id="historyList" class="list"></div></article></section></section></main><dialog id="confirmDialog"><form method="dialog"><h3 id="confirmTitle">确认行动</h3><label>补充说明<textarea id="actionNote" rows="4" style="width:100%;margin-top:8px"></textarea></label><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button value="cancel" class="button">取消</button><button value="confirm" class="button">确认并写入输入框</button></div></form></dialog><script>
(()=>{'use strict';const host=window.parent&&window.parent!==window?window.parent:window;const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const escape=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const app={state:null,timer:null,offs:[],selectedAction:null};function api(name){return window[name]||host[name]||host.TavernHelper?.[name]||null}async function currentState(){try{const getVariables=api('getVariables');const getCurrentMessageId=api('getCurrentMessageId');if(getVariables){const message_id=typeof getCurrentMessageId==='function'?getCurrentMessageId():'current';const vars=await getVariables({type:'message',message_id});return vars?.stat_data||vars||null}const mvu=window.Mvu||host.Mvu;if(mvu?.getMvuData){const data=await mvu.getMvuData({type:'message',message_id:'current'});return data?.stat_data||null}}catch(error){showConnection('读取失败：'+error.message,true)}return window.__RP_UI_MOCK__||null}function rows(target,items,render){$(target).innerHTML=(items||[]).length?(items||[]).map(render).join(''):'<div class="empty">暂无记录</div>'}function render(state){app.state=state||{};const world=app.state.世界||{};$('#clock').textContent=world.当前时间||'时间未记录';$('#location').textContent=world.当前区域||'区域未记录';$('#weather').textContent=world.环境||'环境未记录';const pressure=Number(world.潮压??0),hull=Number(app.state.载具?.完整度??0);$('#pressure').textContent=pressure;$('#pressureBar').style.width=Math.max(0,Math.min(100,pressure))+'%';$('#hull').textContent=hull+'%';$('#hullBar').style.width=Math.max(0,Math.min(100,hull))+'%';const actions=app.state.行动||[];$('#actionCount').textContent=actions.length;rows('#feed',app.state.事件流,x=>'<div class="row"><span>'+escape(x.时间||'')+' '+escape(x.内容||x)+'</span><span class="tag">'+escape(x.类型||'事件')+'</span></div>');rows('#risks',app.state.风险,x=>'<div class="row danger"><span>'+escape(x.名称||x)+'</span><b>'+escape(x.等级||'未知')+'</b></div>');rows('#crewList',app.state.人物,x=>'<div class="row searchable"><span><b>'+escape(x.姓名)+'</b><br><small>'+escape(x.状态||'')+'</small></span><span>'+escape(x.关系||'未记录')+'</span></div>');rows('#cargoList',app.state.物资,x=>'<div class="row searchable"><span>'+escape(x.名称)+'</span><span>'+escape(x.数量)+' · '+escape(x.状态||'')</span></div>');rows('#intelList',app.state.线索,x=>'<div class="row searchable"><span>'+escape(x.标题||x)+'</span><span class="tag">'+escape(x.进度||'待查')+'</span></div>');$('#actionList').innerHTML=actions.length?actions.map(x=>'<button class="button" data-command="'+escape(x.指令||x)+'">'+escape(x.名称||x)+'</button>').join(''):'<div class="empty">当前没有可执行行动</div>';$$('[data-command]').forEach(b=>b.onclick=()=>openAction(b.dataset.command));showConnection(state?'已连接当前消息状态':'使用模拟/回退状态',!state)}function showConnection(text,error=false){$('#connection').textContent=text;$('#connection').classList.toggle('danger',error)}async function refresh(){render(await currentState())}function setInput(text){const textarea=host.document?.querySelector('#send_textarea');if(textarea){textarea.value=text;textarea.dispatchEvent(new Event('input',{bubbles:true}));textarea.focus();return true}const triggerSlash=api('triggerSlash');if(triggerSlash){triggerSlash('/setinput '+JSON.stringify(text));return true}return false}function openAction(command){app.selectedAction=command;$('#confirmTitle').textContent='执行：'+command;$('#actionNote').value='';$('#confirmDialog').showModal()}$('#confirmDialog').addEventListener('close',()=>{if($('#confirmDialog').returnValue!=='confirm')return;const note=$('#actionNote').value.trim();const text='我执行了“'+app.selectedAction+'”'+(note?'，补充说明：'+note:'')+'。';$('#actionFeedback').textContent=setInput(text)?'已写入 SillyTavern 输入框，请确认后发送。':'无法访问输入框，请复制：'+text});$$('[data-view]').forEach(button=>button.onclick=()=>{$$('[data-view]').forEach(x=>x.classList.toggle('active',x===button));$$('.view').forEach(view=>view.classList.toggle('active',view.id===button.dataset.view))});$('#search').addEventListener('input',e=>{$$('.searchable').forEach(row=>row.hidden=!row.textContent.includes(e.target.value))});$('[data-action="refresh"]').onclick=refresh;$('[data-action="load-history"]').onclick=async()=>{const getChatMessages=api('getChatMessages');if(!getChatMessages){$('#historyList').innerHTML='<div class="error">宿主未提供历史接口</div>';return}const messages=await getChatMessages('0-20');rows('#historyList',messages,x=>'<div class="row"><span>'+escape(x.role||x.is_user?'用户':'助手')+'</span><span>'+escape(String(x.message||x.mes||'').slice(0,80))+'</span></div>')};function bindLifecycle(){const eventOn=api('eventOn'),eventTypes=host.tavern_events||host.event_types||{};for(const name of ['CHAT_CHANGED','MESSAGE_UPDATED','MESSAGE_SWIPED','GENERATION_ENDED']){const event=eventTypes[name]||name;if(eventOn){const off=eventOn(event,refresh);if(typeof off==='function')app.offs.push(off)}}app.timer=setInterval(refresh,2500);addEventListener('pagehide',()=>{clearInterval(app.timer);app.offs.forEach(off=>off())},{once:true})}refresh();bindLifecycle()})();
</script></body></html>
