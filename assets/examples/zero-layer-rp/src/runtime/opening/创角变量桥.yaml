schema_version: 1.0.0
display_name: 浮桥终端创角变量桥
runtime_kind: zero_layer

input_fields:
  - id: name
    label: 呼号
    type: text
    required: true
  - id: duty
    label: 当前职能
    type: text
    required: true
  - id: entry_point
    label: 接入节点
    type: text
    required: true

bindings:
  - input: name
    target: user_entry.profile.name
  - input: duty
    target: user_entry.profile.identity.public
  - input: entry_point
    target: user_entry.profile.entry_point.location

commit:
  route: helper_script
  marker: "<浮桥创角/>"
  api_ref: 由独立前端内的宿主桥接脚本负责写入并读回；未接入脚本时不得显示成功
  readback: 终端首页、记录库和行动页显示同一份创角结果
  failure_fallback: 回退为可复制的主控设定消息，不创建页面外常驻状态
