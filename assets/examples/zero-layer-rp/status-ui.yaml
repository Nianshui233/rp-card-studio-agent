schema_version: 2.0.0
status: locked
status_ui:
  enabled: true
  authoring_mode: direct_html
  experience_level: super_heavy
  theme_direction: "雾港航行终端"
  device_priority: equal
  ui_requirements:
    interview_status: locked
    purpose: "让前端承担雾港探索、航行、风险管理、人物与物资操作的主要游玩流程"
    primary_journey: "读取当前世界 → 规划航线/行动 → 检查风险与物资 → 写入行动 → 查看新楼层结果"
    player_tasks: ["探索区域", "管理载具与物资", "查看人物和线索", "发起主要行动", "读取历史"]
    information:
      must_show: ["当前区域", "载具状态", "主要风险", "人物", "物资", "行动入口"]
      useful: ["事件", "线索", "历史消息", "跨域搜索"]
      detail_only: ["完整事件档案", "历史状态快照"]
      may_be_empty: ["人物", "线索", "事件"]
      data_scale: large_cross_domain
      update_cadence: event_and_poll
    interactions:
      desired: ["六区导航", "跨域搜索", "确认弹窗", "历史读取", "行动写入", "全屏"]
      host_actions: ["读取当前楼层", "读取历史消息", "写入 SillyTavern 输入框"]
      feedback: ["加载", "过期状态", "成功", "失败", "复制回退"]
      avoid: ["把复杂项目压成单屏仪表盘", "切换聊天后沿用旧楼层"]
    visual:
      direction: "雾港航行终端、潮湿金属、信号灯和海图网格"
      palette: "墨蓝、铁灰、航标橙、危险红"
      font_direction: "正文采用窄屏可读的等宽/半等宽数据字体，标题使用工业终端展示字"
      icon_direction: "航线、风险、人物、物资使用统一几何 SVG，主题徽记使用项目自制图形"
      density: immersive
      theme_mode: single
      motion: "终端切页、风险脉冲与减少动画回退"
    device: { priority: equal, touch: true, narrow_screen: true, long_chinese_text: true }
    carrier: { user_facing_goal: "前端成为主要游玩表面", agent_choice: zero_layer }
    assets: { font_strategy: local_font, icon_strategy: project_svg, remote_dependencies: [] }
    recommendations: ["保留历史访问", "全屏与聊天消息间可恢复", "大列表使用搜索、分区和渐进展示"]
    open_questions: []
    locked_decisions: ["超重型/0层", "整楼消息替换", "聊天切换后重新读取当前楼层"]
  surfaces:
    - id: floating_terminal
      name: 浮桥终端
      marker: "<浮桥终端>...</浮桥终端>"
      file: src/runtime/ui/浮桥终端.html
      app_manifest: null
      render_route: regex_replace
      render_ref: zero_display
      render_evidence: ["整楼 XML 由 display 正则替换为主游玩应用"]
      emission: { producer: model_output, cadence: every_assistant_message, source_ref: zero_output_contract, evidence: [] }
      prompt_channel: { mode: replace, regex_ref: zero_prompt, fallback_text: "浮桥终端已显示，继续依据状态推进", evidence: [] }
  data_sources: ["当前消息 stat_data"]
  state_contract:
    root: stat_data
    scope: { type: message, message_id: current }
    refresh: { mode: event_and_poll, events: [CHAT_CHANGED, MESSAGE_UPDATED, MESSAGE_SWIPED, GENERATION_ENDED], interval_ms: 2500 }
    paths:
      - { path: 世界.当前区域, type: string, readers: [floating_terminal], writers: [model_update], fallback: 未记录, readable_by: [ui, ejs], writable_by: [model_update], readonly: false, derived: false, update_guard: "场景切换时更新" }
      - { path: 载具.完整度, type: number, readers: [floating_terminal], writers: [model_update], fallback: 0, readable_by: [ui], writable_by: [model_update], readonly: false, derived: false, update_guard: "0..100" }
  host_interactions: ["读取当前楼层", "写入输入框", "读取历史消息", "响应聊天切换与 Swipe"]
  frontend_build: null
  zero_layer:
    message_replacement: whole_message
    floor_policy: latest_only
    chat_switch: reload_application
    primary_play_surface: true
    history_access: through_frontend
    fullscreen: supported
    persistence: [message_state, local_storage]
    lifecycle_script: zero_lifecycle
  opening_relationship: unified_zero_layer
  experience_evidence:
    baseline:
      navigation: ["六个主功能区"]
      data_views: ["世界、载具、事件、风险、人物、物资、线索、行动、历史"]
      information_tools: ["搜索、详情、历史读取"]
      host_actions: ["输入框写入、当前楼层读取"]
      feedback_states: ["加载、空态、失败、成功回退"]
      responsive_checks: ["桌面、窄屏、触控"]
      theme_features: ["雾港仪表终端视觉"]
      data_binding: ["当前消息 stat_data 与事件刷新"]
    level_advancements:
      usability: ["应用内完成主要游玩操作"]
      information_architecture: ["六区导航与跨域搜索"]
      interaction_depth: ["确认弹窗、输入框联动、历史读取"]
      visual_expression: ["主题化仪表和状态反馈"]
      host_integration: ["消息、事件、输入框、历史 API"]
      persistence_lifecycle: ["聊天切换、Swipe、编辑、定时刷新、卸载解绑"]
    primary_play_surface: true
  lifecycle_checks: ["切换聊天后重载", "Swipe 后读取当前楼层", "pagehide 清理事件和定时器"]
  runtime: not_run
source_refs: []
