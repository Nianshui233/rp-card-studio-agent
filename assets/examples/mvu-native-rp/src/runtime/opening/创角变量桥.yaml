schema_version: 1.0.0
display_name: 纸鸢台创角变量桥
runtime_kind: mvu_native

input_fields:
  - id: name
    label: 名称
    type: text
    required: true
  - id: starting_region
    label: 起始区域
    type: text
    required: true
  - id: temperament
    label: 初始情绪
    type: text
    required: false

bindings:
  - input: name
    target: stat_data.角色.名称
    transform: text
  - input: starting_region
    target: stat_data.世界.当前区域
    transform: text
  - input: temperament
    target: stat_data.角色.情绪
    transform: text

commit:
  route: update_message
  marker: "<纸鸢开局设定/>"
  source_file: src/runtime/opening/开局设定消息.yaml
  api_ref: MVU 更新管线
  update_example: |-
    <UpdateVariable>
    _.set('角色.名称', '林砚');
    _.set('世界.当前区域', '纸鸢台东侧栈桥');
    _.set('角色.情绪', '警觉');
    </UpdateVariable>
  readback: 提交后重新读取 stat_data，确认名称、区域或情绪至少一项已脱离默认值
  failure_fallback: 复制完整更新块，停止自动开局生成
