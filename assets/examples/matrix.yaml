schema_version: 1.0.0
purpose: "自包含原创样本覆盖矩阵；用于 Agent 学习与回归验收，不是用户项目模板。"
samples:
  - id: self-contained-rp
    route: "非 MVU 消息状态"
    rp_shape: "可自运转世界与群像"
    runtime: [xml_marker, regex, helper_script]
    ui: "轻型持续状态应用"
    delivery: [worldbook, regex_html_pair, helper_script]
    fallback: [missing_state, host_input_unavailable, streaming_hide]
  - id: mvu-native-rp
    route: "原生 MVU"
    rp_shape: "规则驱动群像"
    runtime: [mvu, mvu_loader, native_schema, initvar, regex]
    ui: "无持续前端"
    delivery: [worldbook, mvu_sources, regex]
    fallback: [mvu_not_ready, current_floor_unavailable]
  - id: mvu-zod-rp
    route: "MVU_ZOD + EJS"
    rp_shape: "系统化议事 RP"
    runtime: [mvu, mvu_loader, mvu_schema, mvu_zod, schema, ejs_independent, regex]
    ui: "无持续前端"
    delivery: [worldbook, mvu_sources, ejs, regex]
    fallback: [prefault_is_not_initial_value, host_dependency_missing]
  - id: opening-ui-rp
    route: "开场与持续 UI 分离"
    rp_shape: "入口导览 + 持续剧情"
    runtime: [opening_bridge, regex, modular_ui]
    ui: ["中型开场应用", "轻型持续状态应用"]
    delivery: [opening_html, status_html, regex_html_pair]
    fallback: [copyable_creation_block, empty_state]
  - id: multi-surface-rp
    route: "多消息表面"
    rp_shape: "多功能消息工具"
    runtime: [multi_marker, regex, message_actions]
    ui: "多个独立功能页"
    delivery: [multi_html, regex_html_pair]
    fallback: [page_specific_empty_state, host_action_copy]
  - id: zero-layer-rp
    route: "独立前端 / 0 层"
    rp_shape: "前端作为主要游玩表面"
    runtime: [mvu, lifecycle, persistence, regex]
    ui: "超重型"
    delivery: [single_complete_html, lifecycle_script, regex_html_pair]
    fallback: [reload, swipe, chat_switch, narrow_screen]
  - id: retrofit-rp
    route: "旧卡改造"
    rp_shape: "保留事实、重构承载方式"
    runtime: [original_preservation, unknown_field_audit, user_template, regex]
    ui: "现状审查后重做"
    delivery: [original_copy, preserved_copy, worldbook, regex_html_pair]
    fallback: [legacy_unknown_field, removed_user_profile, missing_script, clean_and_omit_without_runtime_gate]
  - id: sparse-heavy-ui-rp
    route: "稀疏变量 + 重型体验"
    rp_shape: "静态世界模块与少量动态事实"
    runtime: [sparse_data, derived_view, local_ui_state, empty_state]
    ui: "重型持续状态应用"
    delivery: [worldbook, complete_html, regex_html_pair]
    fallback: [unknown_value, not_established, no_fake_data]
  - id: mvu-ejs-medium-rp
    route: "MVU + EJS + 中型消息前端"
    rp_shape: "河湾通信站与夜班事件"
    runtime: [mvu, mvu_loader, mvu_schema, initvar, ejs_worldbook_inline, ejs_getvar, ejs_getwi, ejs_marker_cleanup, regex, medium_opening_ui, medium_status_ui]
    ui: ["中型开场应用", "中型持续状态应用"]
    delivery: [worldbook, helper_scripts, mvu_sources, ejs_sources, regex_html_pair]
    fallback: [ejs_missing_value, ejs_host_not_run, mvu_not_ready, host_input_copy]
