schema_version: 2.0.0
status: locked

narrative:
  point_of_view: "第三人称有限视角"
  pacing: "雨夜慢节奏，事件随住客行动自然推进"
  prose_and_dialogue: "环境声、人物动作与简洁对白并重"
  npc_and_world_initiative: ["旅店住客有自己的行程、秘密与冲突"]
  never_decide_for_user_character: ["不替主控决定行动、想法或台词"]
  information_policy: ["只呈现当前可见、可听或已经获得的信息"]
  reply_handoff: "以正在变化的现场收束"

opening_ui:
  enabled: true
  authoring_mode: multi_file_html
  app_manifest: "src/runtime/apps/opening/ui-app.yaml"
  marker: "<雨幕开场/>"
  file: "src/runtime/ui/开场页.html"
  render_route: regex_replace
  render_ref: null
  render_evidence: ["模块化开场应用构建为完整 HTML"]
  opening_id: default
  experience_level: medium
  theme_direction: "旧旅店、雨夜登记簿与暖灯"
  device_priority: equal
  ui_requirements:
    interview_status: locked
    purpose: "介绍雨幕旅店、完成主控登记并安全进入真实开场"
    primary_journey: "阅读导览 → 选择来意 → 填写身份 → 预览设定 → 提交或复制回退"
    player_tasks: ["了解世界与玩法", "填写姓名和房间", "确认今夜来意", "提交主控设定"]
    information:
      must_show: ["旅店概况", "游玩提示", "姓名", "房间", "今夜来意", "提交结果"]
      useful: ["住客传闻", "可选来意建议"]
      detail_only: ["版本说明", "完整更新记录"]
      may_be_empty: ["今夜来意"]
      data_scale: small_form
      update_cadence: opening_only
    interactions:
      desired: ["导览切页", "来意选择", "输入校验", "设定预览", "确认提交"]
      host_actions: ["写入主控设定文本到 SillyTavern 输入框"]
      feedback: ["必填提示", "提交成功", "宿主不可用时显示复制回退"]
      avoid: ["提交后无反馈", "用假变量冒充写入成功"]
    visual:
      direction: "旧旅店登记簿、雨夜暖灯与湿润玻璃"
      palette: "深木棕、煤油灯金、雨夜蓝灰"
      font_direction: "正文使用高可读中文黑体，标题使用轻微档案感展示字"
      icon_direction: "房牌、雨伞、登记、确认使用内嵌线性 SVG"
      density: comfortable
      theme_mode: single
      motion: "缓慢雨线与克制翻页"
    device: { priority: equal, touch: true, narrow_screen: true, long_chinese_text: true }
    carrier: { user_facing_goal: "聊天首楼中的完整开场应用", agent_choice: message_surface }
    assets: { font_strategy: design_reference, icon_strategy: project_svg, remote_dependencies: [] }
    recommendations: ["手机单列、电脑双栏", "所有提交动作保留可复制文本"]
    open_questions: []
    locked_decisions: ["开场UI为中型", "持续状态页另行设计", "不依赖持续状态栏完成创角"]
  journey: "阅读导览 → 选择来意 → 填写身份 → 预览设定块 → 写入酒馆输入框"
  fallback: "界面失效时仍显示可直接复制的主控设定块"
  runtime: not_run

creation_bridge:
  enabled: true
  content_policy: blank_user_defined
  profile_contract: src/user-character.yaml
  profile_output: user_entry_yaml_block
  runtime_output: initial_state_patch
  input_fields:
    - { id: name, label: 姓名, type: text, required: true }
    - { id: public_identity, label: 公开身份, type: text, required: false }
    - { id: starting_location, label: 入住房间, type: select, required: true }
    - { id: starting_goal, label: 今夜来意, type: textarea, required: false }
  bindings:
    - { input: name, contract_path: "profile.name", targets: { user_entry: "profile.name" }, transform: text }
    - { input: public_identity, contract_path: "profile.identity.public", targets: { user_entry: "profile.identity.public" }, transform: text }
    - { input: starting_location, contract_path: "runtime.location.current", targets: { runtime: "消息.主控.当前位置" }, transform: text }
    - { input: starting_goal, contract_path: "runtime.progress.current_goal", targets: { runtime: "消息.主控.当前目标" }, transform: text }
  commit:
    route: user_message
    marker: "<雨幕创角>"
    source_file: "src/runtime/apps/opening/scripts/host-adapter.js"
    api_ref: null
    worldbook_ref: null
    entry_name: "雨幕旅店主控设定（<user>）"
    write_mode: none
    worldbook_readback: null
    user_entry_write: copy_only
    runtime_write: message_update
    order: [render_outputs, write_user_entry, readback_user_entry, write_runtime, readback_runtime, start_opening]
    readback: "预览中分别显示静态 <user> YAML 与动态开局状态；写入输入框的文本与两份预览一致"
    failure_fallback: "保留表单，分别复制静态 <user> YAML 和动态开局状态"

openings:
  - id: default
    display_name: "雨夜入住"
    is_default: true
    visible_text: "<雨幕开场/>"
    prompt_visible_text: "暴雨中的旅店正在接纳今夜来客，等待实际主控设定后开始。"

dialogue_examples: []
source_refs: []
