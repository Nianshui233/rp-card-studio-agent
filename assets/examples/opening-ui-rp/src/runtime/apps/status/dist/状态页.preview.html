<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雨幕旅店 · 夜间房态</title>
  <style>
/* ===== style: styles/tokens.css ===== */
:root {
  --night: #0f151b;
  --panel: #182128;
  --raised: #202d35;
  --text: #edf0ed;
  --muted: #9eafb5;
  --rain: #6e98ad;
  --lamp: #e2a85f;
  --line: rgba(255,255,255,.12);
  --success: #8eb080;
  --danger: #d27870;
  --radius: 12px;
}

/* ===== style: styles/app.css ===== */
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { padding: 10px; color: var(--text); background: linear-gradient(145deg, #10171d, #191619); font: 14px/1.65 "Microsoft YaHei", "Noto Sans SC", sans-serif; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18; background: repeating-linear-gradient(105deg, transparent 0 20px, rgba(126,172,193,.2) 21px, transparent 22px); }
button, input { font: inherit; } button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.status-app { width: min(820px, 100%); margin: auto; overflow: hidden; border: 1px solid #3f5863; border-radius: var(--radius); background: rgba(24,33,40,.97); box-shadow: 0 12px 36px rgba(0,0,0,.35); }
.status-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 18px; background: linear-gradient(110deg, #17242c, #332621); border-bottom: 1px solid var(--line); }
.eyebrow { margin: 0; color: var(--rain); font-size: 9px; letter-spacing: 3px; }.status-head h1 { margin: 2px 0 0; color: var(--lamp); font: 700 24px/1.2 "STKaiti", "KaiTi", serif; letter-spacing: 4px; }
.sync { border: 1px solid var(--line); border-radius: 99px; padding: 4px 9px; color: var(--muted); font-size: 11px; }.sync.ready { color: var(--success); border-color: var(--success); }
.weather-strip { display: grid; grid-template-columns: repeat(4, 1fr); background: #111a20; border-bottom: 1px solid var(--line); }.weather-strip span { padding: 8px 10px; color: #c2cdd0; border-right: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.weather-strip span:last-child { border-right: 0; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }.tab { min-height: 45px; border: 0; color: var(--muted); background: #1d262c; }.tab:hover, .tab.active { color: var(--lamp); background: rgba(226,168,95,.12); }
.view { display: none; padding: 15px 17px; }.view.active { display: block; animation: reveal .2s ease-out; }@keyframes reveal { from { opacity: 0; transform: translateY(5px); } }
.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }.metric, .panel, .guest-card, .event-card { border: 1px solid var(--line); border-radius: 9px; background: var(--raised); padding: 10px 11px; }.metric span { display: block; color: var(--muted); font-size: 10px; }.metric strong { display: block; margin-top: 3px; color: var(--lamp); font-size: 15px; }
.panel { margin-top: 8px; }.panel h2 { margin: 0 0 5px; color: var(--rain); font-size: 14px; }.panel p { margin: 0; color: #c8d0d1; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }.quick button, .guest-card button, .action-bar button { border: 1px solid var(--lamp); border-radius: 7px; background: transparent; color: var(--lamp); padding: 7px 10px; }.quick button:hover, .action-bar button { color: #1b1713; background: var(--lamp); }
.search { display: grid; gap: 5px; color: var(--muted); margin-bottom: 9px; }.search input, .action-bar input { min-width: 0; border: 1px solid var(--line); border-radius: 7px; background: #11171b; color: var(--text); padding: 8px 10px; }
.card-list, .timeline { display: grid; gap: 7px; }.guest-card header { display: flex; justify-content: space-between; gap: 8px; }.guest-card h3, .event-card h3 { margin: 0; color: var(--lamp); }.guest-card p, .event-card p { margin: 5px 0 0; color: var(--muted); }.guest-card details { margin-top: 7px; color: #c7d1d3; }
.event-card { border-left: 3px solid var(--rain); }.event-stage { display: inline-block; margin-top: 7px; border: 1px solid var(--line); padding: 1px 6px; color: var(--rain); font-size: 10px; }
.action-bar { display: grid; grid-template-columns: 1fr auto; gap: 7px; padding: 10px 17px; border-top: 1px solid var(--line); background: #131b20; }
.toast { position: fixed; left: 50%; bottom: 15px; transform: translate(-50%, 10px); opacity: 0; pointer-events: none; border: 1px solid var(--lamp); background: #12181c; color: var(--text); padding: 7px 12px; transition: .18s; }.toast.show { opacity: 1; transform: translate(-50%, 0); }
.empty, .error { padding: 24px 10px; text-align: center; color: var(--muted); }.error { color: var(--danger); }

/* ===== style: styles/responsive.css ===== */
@media (max-width: 600px) {
  body { padding: 5px; }
  .weather-strip, .metric-grid { grid-template-columns: repeat(2, 1fr); }
  .status-head { align-items: flex-start; }
  .action-bar { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <!-- fragment:APP_SHELL -->
<main class="status-app" id="app">
  <header class="status-head"><div><p class="eyebrow">RAIN CURTAIN INN</p><h1>夜间房态</h1></div><div class="sync" id="sync">等待读取</div></header>
  <div class="weather-strip"><span id="time">深夜</span><span id="weather">暴雨</span><span id="location">二楼临街房</span><span id="noise">走廊有人经过</span></div>
  <nav class="tabs"><button class="tab active" data-view="room">房态</button><button class="tab" data-view="guests">住客</button><button class="tab" data-view="events">事件</button></nav>
  <section class="view active" id="view-room"><div class="metric-grid" id="roomMetrics"></div><article class="panel"><h2>眼下动静</h2><p id="situation"></p></article><div class="quick"><button data-action="环顾房间和窗外的雨势">环顾</button><button data-action="侧耳听走廊里的动静">倾听</button><button data-action="检查门窗和随身物品">检查</button><button data-action="熄灯休息一阵">休息</button></div></section>
  <section class="view" id="view-guests"><label class="search">搜索住客<input id="guestSearch" type="search" placeholder="姓名、身份、关系或心事"></label><div id="guestList" class="card-list"></div></section>
  <section class="view" id="view-events"><div id="eventList" class="timeline"></div></section>
  <footer class="action-bar"><input id="customAction" placeholder="写下接下来想做的事"><button id="writeAction">写入输入框</button></footer>
  <div class="toast" id="toast" role="status"></div>
</main>

<!-- /fragment:APP_SHELL -->
  <script>
window.__RP_UI_MOCK__ = {"time":"子时二刻","weather":"暴雨未歇","location":"二楼临街房","noise":"楼下传来杯碟碰撞声","room":{"温度":"微凉","灯火":"一盏油灯","门窗":"门闩完好","安全":"暂时安稳"},"situation":"雨水不断敲打窗纸。走廊尽头的房门刚刚合上，但脚步声并没有立刻远去。","guests":[{"name":"程掌柜","role":"旅店掌柜","relation":"相识","state":"在柜台核对住客簿","secret":"担心后院马厩里的陌生马匹"},{"name":"阿岚","role":"渡船帮工","relation":"初见","state":"独自在灶间烤火","secret":"反复查看一封被雨打湿的信"},{"name":"宋七","role":"行脚药商","relation":"陌生","state":"住在背院房","secret":"行囊里似乎藏着易碎之物"}],"events":[{"name":"失踪的信使","stage":"显露","next":"有人可能认出湿信上的印记"},{"name":"后院陌生马匹","stage":"发酵","next":"雨势减弱后马厩会出现新的痕迹"}]};
</script>
<script>
(() => {
"use strict";
/* ===== script: scripts/state.js ===== */
const AppState = { data: null, currentView: "room", filter: "" };
const text = (value, fallback = "—") => value === undefined || value === null || value === "" ? fallback : String(value);

/* ===== script: scripts/host-adapter.js ===== */
const Host = {
  scopes() {
    const scopes = [window];
    try { if (window.parent && window.parent !== window) scopes.push(window.parent); } catch {}
    return scopes;
  },
  value(name) {
    for (const scope of this.scopes()) {
      try { if (scope?.[name] !== undefined && scope?.[name] !== null) return scope[name]; } catch {}
    }
    return null;
  },
  readState() { return this.value("__RAIN_STATE__") || window.__RP_UI_MOCK__ || null; },
  writeInput(value) {
    try {
      const input = window.parent?.document?.getElementById("send_textarea");
      if (input) { input.value = `（行动）${value}`; input.focus(); return true; }
    } catch {}
    navigator.clipboard?.writeText?.(`（行动）${value}`);
    return false;
  },
};

/* ===== script: scripts/render.js ===== */
function renderChrome() {
  const data = AppState.data || {};
  document.querySelector("#time").textContent = text(data.time, "时间未明");
  document.querySelector("#weather").textContent = text(data.weather, "天气未明");
  document.querySelector("#location").textContent = text(data.location, "位置未明");
  document.querySelector("#noise").textContent = text(data.noise, "周围安静");
}

function renderRoom() {
  const data = AppState.data || {};
  const entries = Object.entries(data.room || {});
  document.querySelector("#roomMetrics").innerHTML = entries.length ? entries.map(([key, value]) => `<div class="metric"><span>${key}</span><strong>${text(value)}</strong></div>`).join("") : '<div class="empty">暂无房间状态</div>';
  document.querySelector("#situation").textContent = text(data.situation, "雨夜仍在继续，暂时没有新的动静。");
}

function renderGuests() {
  const guests = Array.isArray(AppState.data?.guests) ? AppState.data.guests : [];
  const keyword = AppState.filter.trim();
  const filtered = guests.filter(guest => `${guest.name}${guest.role}${guest.relation}${guest.state}${guest.secret}`.includes(keyword));
  document.querySelector("#guestList").innerHTML = filtered.length ? filtered.map(guest => `<article class="guest-card"><header><h3>${text(guest.name)}</h3><span>${text(guest.relation, "关系未明")}</span></header><p>${text(guest.role)} · ${text(guest.state)}</p><details><summary>已知心事</summary>${text(guest.secret, "尚不了解")}</details><button data-action="找${text(guest.name)}交谈">与其交谈</button></article>`).join("") : '<div class="empty">暂无匹配住客</div>';
}

function renderEvents() {
  const events = Array.isArray(AppState.data?.events) ? AppState.data.events : [];
  document.querySelector("#eventList").innerHTML = events.length ? events.map(event => `<article class="event-card"><h3>${text(event.name, "未名事件")}</h3><p>下一步：${text(event.next, "等待推进")}</p><span class="event-stage">${text(event.stage, "潜伏")}</span></article>`).join("") : '<div class="empty">暂无正在推进的事件</div>';
}

function renderAll() { renderChrome(); renderRoom(); renderGuests(); renderEvents(); }
function showView(name) {
  AppState.currentView = name;
  document.querySelectorAll(".view,.tab").forEach(node => node.classList.remove("active"));
  document.querySelector(`#view-${name}`)?.classList.add("active");
  document.querySelector(`.tab[data-view="${name}"]`)?.classList.add("active");
}

/* ===== script: scripts/interactions.js ===== */
let toastTimer = null;
function toast(message) {
  const node = document.querySelector("#toast");
  node.textContent = message; node.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove("show"), 1500);
}

document.addEventListener("click", event => {
  const view = event.target.closest("[data-view]")?.dataset.view;
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (view) showView(view);
  if (action) toast(Host.writeInput(action) ? "行动已写入输入框" : "无法直接写入，已尝试复制");
});
document.querySelector("#guestSearch").addEventListener("input", event => { AppState.filter = event.target.value; renderGuests(); });
document.querySelector("#writeAction").addEventListener("click", () => {
  const input = document.querySelector("#customAction");
  if (!input.value.trim()) return toast("先写下要做的事");
  toast(Host.writeInput(input.value.trim()) ? "行动已写入输入框" : "无法直接写入，已尝试复制");
});

/* ===== script: scripts/bootstrap.js ===== */
function bootstrap() {
  const sync = document.querySelector("#sync");
  try {
    AppState.data = Host.readState();
    sync.textContent = AppState.data ? "状态已载入" : "暂无状态数据";
    sync.classList.toggle("ready", Boolean(AppState.data));
    renderAll(); showView("room");
  } catch (error) {
    sync.textContent = "读取失败";
    document.querySelector("#view-room").innerHTML = `<div class="error">${text(error.message || error)}</div>`;
  }
}
bootstrap();
})();
</script>
</body>
</html>
