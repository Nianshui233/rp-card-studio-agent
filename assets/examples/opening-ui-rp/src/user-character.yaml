schema_version: 1.2.0
id: user_character_template
display_name: 雨幕旅店主控设定（<user>）
status: locked
contract:
  id: user_character_v1
  mode: adaptive
  profile_scope: static_profile
  starter_field_library:
    static_profile:
      - { id: name, label: 姓名, target: profile.name, type: text }
      - { id: public_identity, label: 公开身份, target: profile.identity.public, type: text }
    initial_runtime:
      - { id: starting_location, label: 入住房间, target: runtime.location.current, type: select }
      - { id: starting_goal, label: 今夜来意, target: runtime.progress.current_goal, type: textarea }
  creation_fields:
    - { id: name, label: 姓名, scope: static_profile, target: profile.name, type: text, required: true }
    - { id: public_identity, label: 公开身份, scope: static_profile, target: profile.identity.public, type: text, required: false }
    - { id: starting_location, label: 入住房间, scope: initial_runtime, target: runtime.location.current, type: select, required: true }
    - { id: starting_goal, label: 今夜来意, scope: initial_runtime, target: runtime.progress.current_goal, type: textarea, required: false }
  static_paths: [profile.name, profile.identity.public]
  runtime_state:
    root: stat_data.主控
    dynamic_paths: [runtime.location.current, runtime.progress.current_goal]
    read_only_mirrors:
      - { from: profile.name, to: runtime.display.name, reason: 状态页显示姓名，静态档案仍是权威来源 }
worldbook:
  enabled_by_default: false
  keys: ["<user>", user]
  constant: true
  position: after_char
  depth: 4
  order: 9995
  probability: 100
  recursion: { prevent_incoming: true, prevent_outgoing: true }
usage:
  optional: true
  activation_instruction: 将开场页生成的静态 YAML 粘贴到本条目并启用；房间和今夜来意作为开局动态状态随聊天消息提交。
  ui_sync_policy: contract_driven
  runtime_state_policy: separate
profile:
  name: ""
  identity: { public: "" }
source_refs: []
