      update_cadence: every_assistant_message
    interactions:
      desired: ["房态/住客/事件切页", "住客搜索", "详情展开", "行动快捷键"]
      host_actions: ["把调查、交谈和休息文本写入输入框"]
      feedback: ["加载", "空态", "行动已写入", "失败后复制"]
      avoid: ["点击无反应", "没有数据时展示模拟住客"]
