    information:
      must_show: ["房间", "天气", "当前住客", "进行中事件", "关键线索"]
      useful: ["住客搜索", "事件详情", "最近行动反馈"]
      detail_only: ["住客完整档案", "历史事件"]
      may_be_empty: ["当前住客", "进行中事件", "关键线索"]
