      icon_direction: "住客、事件、线索、搜索使用统一线性 SVG"
      density: comfortable
      theme_mode: single
      motion: "轻雨线、房牌翻转和减少动画回退"
    device: { priority: equal, touch: true, narrow_screen: true, long_chinese_text: true }
    carrier: { user_facing_goal: "每条回复下方的完整持续状态应用", agent_choice: message_surface }
    assets: { font_strategy: design_reference, icon_strategy: project_svg, remote_dependencies: [] }
