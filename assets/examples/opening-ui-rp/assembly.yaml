      find_regex: /<雨幕开场\s*\/>/g
      replace_file: src/runtime/ui/开场页.html
      wrap_as_html_codeblock: true
      placement: [2]
      disabled: false
      markdown_only: true
      prompt_only: false
      run_on_edit: true
      substitute_regex: 0
      min_depth: null
      max_depth: null
