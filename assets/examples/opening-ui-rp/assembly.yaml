schema_version: 1.0.0
status: locked

card_entry:
  mode: core_world_contract
  content: |-
    雨幕旅店是一份雨夜群像 RP 包。卡面入口负责介绍项目，开场应用负责登记今夜身份，持续状态应用负责进入故事后的房态、住客和事件。
  source_refs: [src/world/旅店世界书.yaml]

worldbook_manifest:
  id: rain_inn_worldbook
  display_name: 雨幕旅店世界书
  scan_depth: null
  token_budget: null
  recursive_scanning: false
  preserve_imported_entries: true
  duplicate_policy: error
  entries:
    - id: user_character_template
      display_name: 雨幕旅店主控设定（<user>）
      source: { kind: file, path: src/user-character.yaml }
      enabled: false
      activation: { mode: constant, primary_keys: ["<user>", user], secondary_keys: [], selective: false, logic: any, case_sensitive: false, match_whole_words: false }
      insertion: { position: after_char, order: 9995, depth: 4, role: system }
      probability: 100
      scan_depth: null
      recursion: { prevent_incoming: true, prevent_outgoing: true, delay_until_recursion: false }
      recipient: shared
      visibility: model
      fallback: block
    - id: world_core
      display_name: 旅店核心
      source: { kind: file, path: src/world/旅店世界书.yaml, selector: /entries/0/content }
      enabled: true
      activation: { mode: constant, primary_keys: [], secondary_keys: [], selective: false, logic: any, case_sensitive: false, match_whole_words: false }
      insertion: { position: before_char, order: 100, depth: null, role: system }
      probability: 100
      scan_depth: null
      recursion: { prevent_incoming: false, prevent_outgoing: false, delay_until_recursion: false }
      recipient: shared
      visibility: model
      fallback: block
    - id: wb_rain_status_contract
      display_name: 持续状态输出契约
      source: { kind: file, path: src/world/旅店世界书.yaml, selector: /entries/1/content }
      enabled: true
      activation: { mode: constant, primary_keys: [], secondary_keys: [], selective: false, logic: any, case_sensitive: false, match_whole_words: false }
      insertion: { position: at_depth, order: 900, depth: 0, role: system }
      probability: 100
      scan_depth: null
      recursion: { prevent_incoming: true, prevent_outgoing: true, delay_until_recursion: false }
      recipient: shared
      visibility: model
      fallback: block

media_manifest:
  enabled: false
  assets: []

runtime_manifest:
  mode: authored
  regex_scripts:
