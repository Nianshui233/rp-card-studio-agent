schema_version: 2.0.0
status: draft

narrative:
  point_of_view: ""
  pacing: ""
  prose_and_dialogue: ""
  npc_and_world_initiative: []
  never_decide_for_user_character: []
  information_policy: []
  reply_handoff: ""

opening_ui:
  enabled: false
  # 默认按真正的浏览器前端应用开发；最终交付前再构建为一个自包含 HTML。
  authoring_mode: multi_file_html
  app_manifest: null
  marker: null
  file: null
  render_route: regex_replace
  render_ref: null
  render_evidence: []
  opening_id: null
  # 用户选定的等级是交付下限；锁定前实际 HTML 必须通过功能面质量探针。
  experience_level: light
  theme_direction: ""
  device_priority: equal
  journey: ""
  fallback: ""
  runtime: not_run
  # compiled_frontend 路线记录源码根、构建命令、输出格式与制品哈希。
  frontend_build: null

# swipe_switch 可把介绍/创角页切到备用开场白，不与持续状态栏混为一体。
opening_transition:
  route: none
  source_message: null
  target_opening: null
  api_ref: null
  evidence: []

# 只要开场表单会改变 MVU/EJS、状态栏或其他运行时数据，就在这里记录
# “表单字段 → 状态路径 → 提交 → 回读”的真实桥接；不能只附加聊天楼 data。
creation_bridge:
  enabled: false
  input_fields: []
  bindings: []
  commit:
    route: none
    marker: null
    source_file: null
    api_ref: null
    # worldbook_api / hybrid 可同时 upsert <user> 条目并写入运行变量。
    worldbook_ref: null
    entry_name: null
    write_mode: none
    worldbook_readback: null
    readback: ""
    failure_fallback: ""

openings: []
dialogue_examples: []
source_refs: []
