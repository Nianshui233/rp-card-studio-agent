schema_version: 1.0.0
level: heavy
description: 面向开放世界和复杂系统的完整 RP 产品界面；以少量高密度完整页面组织大量内部模块，独立正则只留给不同触发时机的剧情组件。
component_templates:
  - launch-screen.yaml
  - introduction-page.yaml
  - opening-selector.yaml
  - player-setup.yaml
  - status-terminal.yaml
  - update-report.yaml
  - roll-result.yaml
  - choice-panel.yaml
  - battle-report.yaml
  - notification.yaml
workspace_modules: [overview, character, world, objectives, inventory, relationships, intelligence, investigation, map, factions, chronology, travel]
requirements: { minimum_surfaces: 5, minimum_workspace_modules: 12, entry: 1, setup: 1, integrated_dashboard: 1, narrative_component: 3, navigation: hub_or_mixed }
