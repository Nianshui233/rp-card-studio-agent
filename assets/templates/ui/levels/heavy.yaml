schema_version: 1.0.0
level: heavy
description: 在完整功能基础上追求华丽、炫酷、沉浸和强主题化，形成多层空间、复杂动效、趣味交互、可视化、深度 JS 联动与宿主协作；仍可保持为消息内综合应用，不强制升级为独立前端。
component_templates:
  - project-portal.yaml
  - status-terminal.yaml
  - update-report.yaml
  - roll-result.yaml
  - choice-panel.yaml
  - battle-report.yaml
  - notification.yaml
workspace_modules: [overview, character, world, objectives, inventory, relationships, intelligence, investigation, map, factions, chronology, travel]
requirements:
  page_count_rule: none
  feature_reduction: none
  visual_richness: immersive_cinematic
  interaction_richness: advanced
  theme_fit: signature
  application_runtime: advanced_optional
  player_impression: 进入界面即进入题材氛围，复杂但仍能快速理解和操作
