schema_version: 1.0.0
level: super_heavy
description: 应用级“独立前端 / 0层游玩卡”档位。消息 HTML 本身成为主要游玩界面，可内联框架与依赖，采用集中状态仓库、复杂路由与弹窗体系、持久化、全屏/多视图、观察器、资源管理和深度宿主 API 协作；聊天层主要承担载体、叙事与数据通道。
component_templates:
  - project-portal.yaml
  - status-terminal.yaml
  - update-report.yaml
  - roll-result.yaml
  - choice-panel.yaml
  - battle-report.yaml
  - notification.yaml
workspace_modules: [overview, character, world, objectives, inventory, relationships, intelligence, investigation, map, factions, chronology, travel, management, encyclopedia]
requirements:
  page_count_rule: none
  feature_reduction: none
  visual_richness: application_grade
  interaction_richness: runtime_deep
  theme_fit: total
  application_runtime: required
  zero_layer_play: supported
  player_impression: 像打开一款独立题材应用，主要操作、浏览和反馈都在前端内完成
  qa_focus:
    - 启动与重新挂载
    - 消息编辑与重绘
    - 状态仓库同步
    - 宿主 API 调用
    - 持久化与聊天切换隔离
    - 弹窗与路由返回
    - 全屏与窄屏
    - 资源失败与降级
    - 卸载清理与重复初始化
