schema_version: 2.0.0
status: draft
ui_component:
  id: introduction_page
  display_name: 完整项目介绍页
  role: guide
  preset: introduction_page
  trigger: { kind: self_closing, marker: RPIntroduction, producer: opening }
  data_contract: { mode: none, payload_format: none }
  binding_refs: []
  interactions: [local_interaction, opening_swipe, host_bridge]
  content:
    eyebrow: 项目档案
    title: 项目名与版本
    subtitle: 在一张完整消息页里完成项目介绍、依赖说明、世界导语、更新信息、作者留言和游玩指南。
    body:
      - 介绍页是进入 RP 项目的正式门面，不是只有一个标题和按钮的启动画面。
      - 页面应使用项目自己的视觉语言，并为窄屏、编辑消息和纯文本回退负责。
    primary_action: 选择开场或开始
    secondary_action: null
    sections:
      - id: requirements
        title: 核心插件与运行条件
        body: [列出真正必需的 SillyTavern、Tavern Helper、MVU、EJS 或其他插件依赖与版本说明。]
        collapsed: false
      - id: world_intro
        title: 世界观导语
        body: [用面向游玩者的短文解释世界当前处境、核心矛盾与体验边界，不复制整份世界书。]
        collapsed: false
      - id: changelog
        title: 版本与更新信息
        body: [列出当前版本、重要变化、已知问题和兼容性提醒。]
        collapsed: true
      - id: creator_note
        title: 作者留言
        body: [说明创作意图、推荐节奏或想让游玩者注意的体验重点；个人自用时可省略。]
        collapsed: true
      - id: play_guide
        title: 游玩指南
        body: [说明预制开场、自由创角、状态终端、检定、选项和指令如何使用。]
        collapsed: false
      - id: content_note
        title: 内容提示
        body: [仅在项目确有需要时列出题材提示；不要把作者侧 NSFW 开关做成运行时门禁。]
        collapsed: true
  layout: { kind: article, groups: [] }
  states: { loading: 正在载入项目介绍, empty: 暂无项目介绍, error: 介绍页交互不可用, degraded: 请阅读普通文本版项目说明 }
  source: { mode: generated, html: "", css: "", js: "" }
  delivery: { surface: message, adapter: tavern_helper_message, level: host_required, run_on_edit: true, min_depth: null, max_depth: 5 }
  acceptance: { runtime: not_run, fallback: 保留项目名、版本、依赖、世界导语、更新信息、作者留言和游玩指南的纯文本版。 }