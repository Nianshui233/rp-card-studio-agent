schema_version: 2.0.0
status: draft
ui_component:
  id: status_terminal
  display_name: 综合状态终端
  role: dashboard
  preset: status_terminal
  trigger: { kind: placeholder, marker: StatusPlaceHolderImpl, producer: runtime }
  data_contract: { mode: stat_data, payload_format: none }
  binding_refs: []
  interactions: [local_interaction]
  content:
    eyebrow: LIVE STATE
    title: 当前状态
    subtitle: 根据项目主要玩法组织一级标签与二级折叠，不把所有变量平铺。
    body: []
    primary_action: null
    secondary_action: null
  layout:
    kind: tabs
    groups:
      - { id: overview, label: 总览, binding_refs: [], collapsed: false }
      - { id: character, label: 角色, binding_refs: [], collapsed: false }
      - { id: world, label: 世界, binding_refs: [], collapsed: false }
      - { id: objectives, label: 目标, binding_refs: [], collapsed: false }
  states: { loading: 正在读取当前楼状态, empty: 暂无可显示状态, error: 当前楼变量读取失败, degraded: 状态终端暂时不可用 }
  source: { mode: generated, html: "", css: "", js: "" }
  delivery: { surface: message, adapter: tavern_helper_message, level: host_required, run_on_edit: true, min_depth: null, max_depth: 5 }
  acceptance: { runtime: not_run, fallback: 使用普通文本概括当前状态。 }
