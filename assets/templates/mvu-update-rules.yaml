# canonical MVU 更新规则模板：实际项目必须覆盖 Schema 的每个可写状态根和字段族，不得作为简略成品直接交付。
变量更新规则:
  总则:
    - "只根据当前回复中真实发生的变化更新，不为看起来完整而机械改值"
    - "每个字段只有一个权威写者；只读/派生字段不得由模型修改"
    - "先核对当前 stat_data，再生成更新；禁止猜测不存在的路径"
    - "明确区分标量、Record 和 Array；Record 使用键名，Array 使用下标或追加位置"

  世界:
    当前日期:
      类型: string
      更新条件: ["跨日", "明确跳日"]
      不更新条件: ["普通对话", "没有时间推进证据"]
    当前时间:
      类型: string
      格式: "HH:MM"
      更新条件: ["行动耗时", "休息", "场景推进"]
    当前地点:
      类型: string
      更新条件: ["角色真实完成移动"]

  玩家:
    生命值:
      类型: number
      范围: "0-100"
      更新条件: ["受伤", "治疗", "长期恢复"]
      合理变化: "依据伤势和治疗强度，不无因满值"
    体力:
      类型: number
      范围: "0-100"
      更新条件: ["奔跑、战斗、重体力行动、休息"]
    背包:
      类型: "Record<string,string>"
      新增: "取得新物品时以物品名为键写入"
      修改: "消耗、损坏、合并或数量变化时修改原键"
      删除: "耗尽、遗失或丢弃时删除键"

  任务:
    主线:
      更新条件: ["目标改变", "阶段推进", "完成或失败"]
      同步要求: "名称、阶段、进度必须与正文一致"

  现场:
    敌对单位:
      类型: array
      更新条件: ["敌人进入、离开、被击败"]
      去重: true
    可调查目标:
      类型: array
      更新条件: ["目标出现、调查完毕、场景离开"]
      去重: true

  冲突与结算:
    顺序: ["识别事实", "计算确定性变化", "应用剧情状态", "更新集合", "校验范围和路径"]
    信息不足: "保持原值，并在正文中表现未知，不创造假数据"
    重复处理: "同一事件只结算一次"
