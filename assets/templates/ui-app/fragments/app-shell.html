<main class="app-shell" id="app">
  <header class="app-header">
    <div>
      <p class="eyebrow">PROJECT RUNTIME</p>
      <h1 id="projectTitle">项目界面</h1>
    </div>
    <div class="connection" id="connectionState">等待宿主</div>
  </header>

  <nav class="app-nav" aria-label="功能导航">
    <button class="nav-item active" data-view="overview">总览</button>
    <button class="nav-item" data-view="characters">人物</button>
    <button class="nav-item" data-view="events">事件</button>
  </nav>

  <section class="view active" id="view-overview">
    <div class="metric-grid" id="overviewMetrics"></div>
    <article class="panel"><h2>当前处境</h2><div id="currentSituation"></div></article>
  </section>
  <section class="view" id="view-characters">
    <label class="search-field">搜索人物<input id="characterSearch" type="search" placeholder="姓名、身份或关系"></label>
    <div class="card-list" id="characterList"></div>
  </section>
  <section class="view" id="view-events">
    <div class="card-list" id="eventList"></div>
  </section>

  <footer class="action-dock">
    <label for="actionInput">行动</label>
    <input id="actionInput" placeholder="写下接下来要做的事">
    <button id="actionCommit">写入酒馆输入框</button>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
