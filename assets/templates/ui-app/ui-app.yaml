schema_version: 1.0.0

ui_app:
  id: project-surface
  surface: status
  experience_level: medium
  # standalone_document 用于独立预览；message_surface 保留 SillyTavern 消息内常见的 head + body 形态。
  output_mode: message_surface
  entry_html: index.html
  fragments:
    - slot: APP_SHELL
      file: fragments/app-shell.html
  styles:
    - styles/tokens.css
    - styles/base.css
    - styles/layout.css
    - styles/components.css
    - styles/responsive.css
  scripts:
    - scripts/state.js
    - scripts/host-adapter.js
    - scripts/render.js
    - scripts/interactions.js
    - scripts/bootstrap.js
  mock_state: mock/state.json
  preview_output: dist/项目界面.preview.html
  script_wrapper: iife
  output: ../../ui/项目界面.html
