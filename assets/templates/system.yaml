  repeated_action: ""              # 同一事实或同类意图重复时的处理
  conflict_priority: []             # 多条规则、角色义务或事件冲突时的顺序
  evaluation_order: []              # 只有顺序会改变结果时填写

consequences: []
world_and_npc_motion: []
