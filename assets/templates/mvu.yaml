schema_version: 1.1.0
status: draft

mvu:
  enabled: false
  implementation: unverified
  update_mode: disabled
  output_dialect: unverified
  storage:
    scope: message
    namespace: stat_data
    snapshot_selector: current_message
    merge_policy: message_over_chat
  protocol:
    id: rp_json_patch
    version: 1.0.0
    envelope: UpdateVariable
    path_syntax: json_pointer
    operations: [replace, delta, insert, remove, move]
    atomicity: batch
    precondition: validate_before_commit
  variables: []
  initialization:
    defaults: {}
    opening_overrides: []
    profiles: []
    opening_bindings: []
  update_rules: []
  routing:
    entries: []

ejs:
  enabled: false
  entries: []

runtime_contract:
  adapter: null
  dependencies: []
  assumptions: []
  fallbacks: []
