schema_version: 1.0.0
status: draft

# 最终 data.description 的维护源。大型世界、玩法、群像和长期 RP 包通常使用
# core_world_contract：写完整的常驻世界核心合同，而不是一两百字简介。
card_entry:
  mode: core_world_contract
  content: ""
  source_refs: []

card_fields: {}

worldbook_manifest:
  id: worldbook_id
  display_name: 未命名世界书
  scan_depth: null
  token_budget: null
  recursive_scanning: false
  preserve_imported_entries: true
  duplicate_policy: error
  entries: []

# 角色卡项目会自动保留一个默认关闭的 `<user>` 主控设定条目。
# 用户填写 src/user-character.yaml 后，可在整合阶段或 SillyTavern 中启用；
# 世界、NPC 和事件不依赖该条目也能自行运转。

media_manifest:
  enabled: false
  assets: []

# authored 表示把已经创作完成的真实 HTML/JS/正则原样装入。
runtime_manifest:
  mode: authored
  regex_scripts: []
  # MVU 项目应在这里登记真实 Tavern Helper 脚本：
  # role=mvu_loader 的框架加载器先于 role=mvu_schema 的变量结构脚本；
  # source_file 可与 mvu.files.schema_script / supporting_files 对应，
  # 交付时这些节点会原样进入 06_酒馆助手，而不是只留在维护源路径里。
  tavern_helper_scripts: []
  extension_fields: {}
