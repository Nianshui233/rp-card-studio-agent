schema_version: 1.2.0
status: draft

status_ui:
  enabled: false
  mode: none
  read_only: true
  refresh: on_message
  text_template: ""
  sections: []
  commands: []
  # These four strings are design metadata until a Tavern Helper message
  # runtime implements conditional state detection. Regex cannot switch them.
  states:
    loading: 正在读取状态
    empty: 暂无可显示状态
    error: 状态暂时不可用
    degraded: 状态信息不可用
  responsive:
    narrow: single_column
    wide: grouped_columns
  visual:
    density: pending
    hierarchy: []
    motion: pending
  accessibility:
    keyboard: true
    live_updates: polite
    color_independent: true
  dependencies: []
  # A generated self-contained message iframe uses level: host_required,
  # adapter: tavern_helper_message, entrypoint: generated, artifact: inline.
  # Generated inline delivery is read-only, on_message, command-free, and
  # non-tabbed. A separately implemented host specification must instead use
  # entrypoint: host_managed and artifact: host_managed.
  delivery: null
