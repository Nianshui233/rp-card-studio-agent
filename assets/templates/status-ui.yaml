schema_version: 2.0.0
status: draft

status_ui:
  enabled: false
  # 开发期拆分 HTML/CSS/JS/模拟数据；最终构建为 surface.file 指向的单文件 HTML。
  authoring_mode: multi_file_html
  # 用户选定的等级是交付下限；锁定前实际 HTML 必须通过功能面质量探针。
  experience_level: light
  theme_direction: ""
  device_priority: equal
  # 每个 surface 在 multi_file_html 模式下同时记录 app_manifest（开发清单）与 file（构建结果）。
  surfaces: []
  # 每个持续表面应同时声明玩家显示消费者与模型提示词消费者，避免技术标记回流。
  # surfaces[].prompt_channel: { mode, regex_ref, fallback_text, evidence }
  data_sources: []
  # state_contract 把真实状态根、当前消息作用域、刷新方式、读写者和回退值连成一条链。
  state_contract: null
  host_interactions: []
  frontend_build: null
  # super_heavy / 0层路线在这里声明整楼替换、楼层策略、聊天切换与持久化。
  zero_layer: null
  opening_relationship: separate
  experience_evidence:
    # 轻型以成熟持续状态应用为体验基准；按项目实际记录，不适用的维度可留空并在阶段总结说明理由。
    baseline:
      navigation: []
      data_views: []
      information_tools: []
      host_actions: []
      feedback_states: []
      responsive_checks: []
      theme_features: []
      data_binding: []
    # 高于轻型时记录相对轻型基线的实际增量；不按填写数量或代码行数定级。
    level_advancements:
      usability: []
      information_architecture: []
      interaction_depth: []
      visual_expression: []
      host_integration: []
      persistence_lifecycle: []
    primary_play_surface: false
  lifecycle_checks: []
  runtime: not_run

source_refs: []
