schema_version: 1.2.0
id: character_id
display_name: 未命名角色
status: draft
role: pending

# 角色模板的目标是让 AI 稳定地“成为这个人”，而不是填写人物数据库。
# 角色先拥有自己的生活、职责、关系与计划，再进入任何具体场景。
identity:
  aliases: []
  age: ""
  gender: ""
  species: ""
  occupation: ""
  appearance:
    - "辨识度高、能在场景中被观察到的外貌特征"
  body:
    height: ""
    build: ""
    details: ""
  clothing:
    everyday: ""
    formal_or_work: ""
    private_or_relaxed: ""
    accessories: []
  impression: ""                    # 最高辨识特征 + 他人的第一反应

story_role:
  function: ""                      # 该角色为 RP 带来什么冲突、关系或体验
  place_in_world: ""                # 所属群体、职业位置、社会作用与现实处境
  current_stakes: ""

# 角色不是等待互动的静态接口；没有出场时也会生活、行动、选择并承担后果。
autonomy:
  current_agenda: ""                # 当下正在主动推进的核心事项
  obligations: []                    # 对职业、组织、家人、同伴、债务或信念的责任
  routines:
    - period: ""                    # 每日 / 每周 / 特定时段 / 事件后
      activity: ""
      location_ref: location:location_id
      companions: []
      interruption_threshold: ""    # 什么程度的事情才会让角色改变原定安排
  resources: []                      # 能独立调动的人脉、权限、金钱、物品与知识
  dependencies: []                   # 真实依赖的角色、组织、地点、资源或制度
  active_plans:
    - goal: ""
      next_action: ""
      deadline: ""
      success_condition: ""
      failure_consequence: ""
  offscreen_actions: []              # 离开当前场景后仍可能采取的行动
  priority_rules: []                 # 多项职责、关系和利益冲突时如何排序
  self_preservation: ""
  private_life: ""                  # 不服务于主要冲突，但使其像真实生活者的部分

psychology:
  motivations:
    goal: ""                         # 当前最想达成、可被验证的目标
    drive: ""                        # 为什么非做到不可
  fears:
    situation: ""                    # 最怕变成怎样的人或落入怎样的处境
    loss: ""                         # 最怕失去的具体对象、关系或状态
  values:
    ranking: ""                      # 如：忠诚 > 真相 > 安全
    rationale: ""                    # 应能推导至少两条行为规则或关系取舍
  taboos: []                          # 绝不会做的可观察行为
  internal_conflict: ""              # 两个重要价值之间无法轻易兼得的张力

behavior:
  rules:
    - trigger: ""
      action: ""
      condition: ""
      reason: ""                     # 应能追溯到 values、fears、taboos、义务或关系事实
      cost: ""
  stress_response:
    - when: ""
      reaction: ""
  quirks: []                          # 小动作、泄露内心的反应、仪式感行为

attitudes:
  close_ones:
    behavior: ""
    subtext: ""
    verbal_change: ""
  strangers:
    behavior: ""
    subtext: ""
    verbal_change: ""
  enemies:
    behavior: ""
    subtext: ""
    verbal_change: ""
  authority:
    behavior: ""
    subtext: ""
    verbal_change: ""
  custom:
    - target_type: ""
      behavior: ""
      subtext: ""
      verbal_change: ""

speech:
  style:
    tone: ""
    structure: ""
    vocabulary: ""
  catchphrases: []
  rules:
    - type: "structure"              # structure / forbidden / emotion_shift / addressing / custom
      content: ""
  quotes:
    - line: ""
      context: ""                    # 用于证明 style/rules 在真实情境下成立，不供机械复读

background:
  origin: ""                         # 只保留会影响当前行为的出身信息
  turning_point: ""                  # 应能解释至少一个恐惧、底线或行为规则
  current_situation: ""
  unresolved_past: []

# ═══ NSFW层（仅当项目预检启用 NSFW 时展开并填写）═══
# 这是角色内容层，不是运行时开关、年龄门禁或拒绝规则。
nsfw:
  sexual_orientation: "性取向"
  standing: "角色定位（如：攻/受/S/M等）"
  fetish:
    - "具体性癖"
  preference: "风格偏好（如：偏好主导/服从/温柔/粗暴等）"
  sex_organs: "具体描述"
  sensitive_areas:
    - "敏感部位 + 反应描述"
  contrast: "性格反差描述（如：平时高冷 → 亲密时粘人且失控等）"

relationships: []

knowledge:
  publicly_known: []
  gm_only: []
  model_only: []
  mistaken: []                        # 角色坚信但并不正确的事
  forbidden: []                       # 角色不可能知道或不得无故说出的信息

growth_arc:
  starting_state: ""
  pressure_points: []
  possible_changes: []
  must_not_change_without_event: []

anti_ooc:
  always: []                          # 任何场景都必须保持的核心行为准则
  never: []                           # 每条 taboo 有直接映射；额外项可从 values 或明确经历推出
  meta_handling: ""
  unknown_handling: ""               # 未覆盖场景如何从动机与价值外推

state_bindings: []                    # 只有确实需要变量联动时填写
tags: []
source_refs: []
