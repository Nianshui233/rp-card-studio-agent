<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>当前前端 · 现场打磨</title><style>/* RP_WORKBENCH_CSS */</style></head><body>
<button id="rpwb-toggle" title="显示或收起打磨工具" aria-label="显示或收起打磨工具" aria-expanded="true"><i data-lucide="sliders-horizontal"></i></button>
<aside id="rpwb" aria-label="前端打磨工具"><header><p>RP CARD STUDIO</p><h1>当前前端 · 现场打磨</h1><p id="rpwb-identity">正在装载实际导入内容</p></header><p id="rpwb-status" role="status">等待页面就绪</p>
<section><h2>查看尺寸</h2><label>消息容器宽度<input id="rpwb-width" type="number" min="240" max="1800" step="1" value="720"><span>px</span></label><label class="rpwb-check"><input id="rpwb-baseline" type="checkbox">查看原样，保留候选参数</label></section>
<section><div class="rpwb-heading"><h2>样式参数</h2><button id="rpwb-reset" title="复位全部参数" aria-label="复位全部参数"><i data-lucide="rotate-ccw"></i></button></div><label id="rpwb-presets-label" hidden>本项目预设<select id="rpwb-presets"><option value="">选择预设</option></select></label><div id="rpwb-controls"></div></section>
<section id="rpwb-state-section" hidden><h2>测试状态</h2><label>本用例快照<select id="rpwb-snapshots"></select></label><button id="rpwb-preview-state"><i data-lucide="eye"></i><span>先看差异</span></button><pre id="rpwb-state-diff"></pre><div id="rpwb-state-actions" hidden><button id="rpwb-apply-state"><i data-lucide="check"></i><span>确认注入此批次</span></button><button id="rpwb-cancel-state" title="取消注入" aria-label="取消注入"><i data-lucide="x"></i></button></div><pre id="rpwb-readback"></pre></section>
<details><summary>实际字段与版面观察</summary><button id="rpwb-observe"><i data-lucide="eye"></i><span>重新观察</span></button><pre id="rpwb-observations"></pre></details>
<section class="rpwb-export"><button id="rpwb-export"><i data-lucide="download"></i><span>保存当前候选</span></button><label>重新载入参数<input id="rpwb-import" type="file" accept=".json,application/json"></label><p>只保存到制作区。重新载入只恢复样式参数，不注入游戏状态。</p><button id="rpwb-close"><i data-lucide="x"></i><span>结束本次打磨</span></button></section></aside>
<section id="rpwb-input"><label for="send_textarea">模拟酒馆输入框</label><textarea id="send_textarea" rows="2"></textarea></section><div id="chat"></div>
<script>/* RP_WORKBENCH_JS */</script></body></html>
