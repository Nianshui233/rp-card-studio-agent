<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前端设计参考</title><style>/* RP_LIBRARY_CSS */</style></head><body>
<header><div><p class="eyebrow">RP CARD STUDIO / DESIGN REFERENCES</p><h1 id="title"></h1><p id="intro"></p></div><div class="receipt"><span>候选参考</span><strong id="total"></strong><span>不是作品模板</span></div></header>
<main><section class="filters" aria-label="筛选资料"><label class="search"><i data-lucide="search"></i><span class="sr-only">检索资料</span><input id="search" type="search" placeholder="地图、创角、长中文、详情……"></label><label>分类<select id="category"><option value="">全部分类</option></select></label><label>种类<select id="kind"><option value="">全部资料</option><option value="reference">来源与用法</option><option value="pattern">任务模式</option><option value="concern">检查关注点</option></select></label><label class="check"><input id="selected-only" type="checkbox">只看已选</label></section>
<div class="workspace"><section class="results" aria-label="检索结果"><p id="count" role="status"></p><div id="list"></div></section><aside id="inspector" aria-label="参考详情"><div class="detail-head"><h2 id="detail-title"></h2><label class="check"><input id="pick" type="checkbox">加入候选</label></div><p class="question" id="question"></p><h3>借鉴什么</h3><p id="application"></p><h3>不直接照搬</h3><p id="avoid"></p><a id="source" target="_blank" rel="noreferrer"><i data-lucide="external-link"></i><span>查看原始来源</span></a><p class="boundary">来源待实际查阅。本地演示只说明方法，不代表当前设计、线上资源、酒馆运行或用户接受。</p><section id="demo-section"><div class="demo-toolbar"><h3 id="demo-title"></h3><label>容器<select id="demo-width"><option value="100%">当前宽度</option><option value="390px">390 px</option><option value="720px">720 px</option></select></label><button id="reset-demo" title="重置演示" aria-label="重置演示"><i data-lucide="rotate-ccw"></i></button></div><p id="demo-note"></p><div class="demo-viewport"><iframe id="demo" title="合成内容的技术演示" sandbox="allow-scripts"></iframe></div></section></aside></div>
</main><footer><p id="selection">尚未选择参考</p><div><button id="copy" title="复制候选清单"><i data-lucide="copy"></i><span>复制清单</span></button><button id="download" title="导出候选清单"><i data-lucide="download"></i><span>导出</span></button><button id="clear" title="清空本阶段候选" aria-label="清空本阶段候选"><i data-lucide="x"></i></button></div><p id="feedback" role="status"></p></footer>
<script>/* RP_LIBRARY_DATA */</script><script>/* RP_LIBRARY_JS */</script></body></html>
