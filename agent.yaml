capabilities: orchestrator/capabilities.yaml
ledger:
  semantic: project.yaml
  technical: .rp-card-state.json
forge:
  entry: scripts/rp-card-forge.bundle.mjs
  source: scripts/rp-card-forge.mjs
default_delivery:
  - character_card_json
